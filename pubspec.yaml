name: tiba_project
description: "Tiba 2 Cyber HUD Car Launcher"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^12.0.0
  url_launcher: ^6.3.1
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.15
  file_picker: ^8.1.7
  shared_preferences: ^2.3.3
  wakelock_plus: ^1.2.8
  volume_controller: ^2.0.7
  audio_session: ^0.1.21

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - tiba2.png
