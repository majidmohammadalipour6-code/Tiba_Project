name: tiba_project
description: "Tiba 2 Custom Cyber HUD Launcher"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  permission_handler: ^11.3.1
  file_picker: ^8.1.3
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - tiba2.png
    - tiba2_rear.png
