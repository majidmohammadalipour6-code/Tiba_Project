name: Build Tiba Launcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Clean Build via Temp Project
        run: |
          # ساخت یک پروژه موقت کاملاً استاندارد و سالم
          flutter create temp_app --platforms=android --org com.tiba.launcher --project-name tiba_project
          
          # کپی کردن کدهای دارت و پاب‌اسپک خودمان به پروژه جدید
          rm -rf temp_app/lib temp_app/pubspec.yaml
          cp -r lib temp_app/
          cp pubspec.yaml temp_app/
          
          # انتقال به پوشه موقت و اجرای بیلد
          cd temp_app
          flutter pub get
          flutter build apk --split-per-abi
          
          # کپی کردن خروجی APK به پوشه اصلی برای آپلود
          mkdir -p ../build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/*.apk ../build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tiba-launcher-release
          path: build/app/outputs/flutter-apk/*.apk
