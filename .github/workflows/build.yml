name: Build Tiba Launcher APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Scaffold Complete Project with GPS Permissions
        run: |
          mkdir -p temp_app
          cd temp_app
          flutter create --org com.tiba.launcher --project-name tiba_launcher .
          
          # افزودن پکیج‌های لازم
          flutter pub add geolocator
          
          # افزودن دسترسی‌های موقعیت مکانی به مانیفست اندروید
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' $MANIFEST
          
          # جایگزینی کد کاربر
          cp -f ../lib/main.dart lib/main.dart
          
          # بیلد نهایی
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tiba2-Launcher-GPS-Final
          path: temp_app/build/app/outputs/flutter-apk/app-debug.apk
