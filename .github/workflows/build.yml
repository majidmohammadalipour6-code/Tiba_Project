name: Build Tiba Launcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Prepare Clean Android Project and Assets
        run: |
          # تولید ساختار بدون نقص و استاندارد اندروید
          flutter create --org com.tiba.launcher --project-name tiba_project temp_app
          rm -rf android
          cp -r temp_app/android ./
          rm -rf temp_app
          
          # آماده‌سازی پوشه assets و انتقال عکس تیبا ۲
          mkdir -p assets
          if [ -f "tiba2.png" ]; then
            cp tiba2.png assets/tiba2.png
          elif [ -f "tiba2.jpg" ]; then
            cp tiba2.jpg assets/tiba2.png
          elif [ -f "tiba2.webp" ]; then
            cp tiba2.webp assets/tiba2.png
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tiba-launcher-release
          path: build/app/outputs/flutter-apk/*.apk
