name: Build Tiba Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Create Project and Build APK
        run: |
          # ۱. ساخت پروژه موقت استاندارد
          flutter create temp_app --org com.tiba.launcher --project-name tiba2_launcher --platforms=android
          
          # ۲. جایگزین کردن پوشه lib شما
          rm -rf temp_app/lib
          cp -r lib temp_app/
          
          # ۳. اضافه کردن درست پکیج‌ها به بخش dependencies
          cd temp_app
          sed -i '/dependencies:/a \  geolocator: ^11.0.0\n  url_launcher: ^6.2.5' pubspec.yaml
          
          # ۴. پاکسازی و دریافت پکیج‌ها
          flutter clean
          flutter pub get
          
          # ۵. بیلد APK با تنظیمات سازگار با اندروید
          flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tiba2-Debug-APK
          path: temp_app/build/app/outputs/flutter-apk/app-debug.apk
