name: Build Tiba Launcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup project structure and assets
        run: |
          mkdir -p assets
          # دانلود خودکار تصویر باکیفیت تیبا ۲ به عنوان tiba2.png
          curl -s -L -o assets/tiba2.png https://images2.imgbox.com/6c/0e/1sD8qNfJ_o.png

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tiba-launcher-release
          path: build/app/outputs/flutter-apk/*.apk
