name: Build Tiba Launcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Check & Fix Android Structure
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.tiba.launcher --project-name tiba_project
          fi

      - name: Update Kotlin Gradle plugin version
        run: |
          KOTLIN_VERSION="1.9.23"
          if grep -q "ext.kotlin_version" android/build.gradle 2>/dev/null; then
            sed -i.bak "s/ext.kotlin_version *= *'[^']*'/ext.kotlin_version = '$KOTLIN_VERSION'/" android/build.gradle
            echo "Updated ext.kotlin_version"
          elif grep -q "org.jetbrains.kotlin" android/settings.gradle 2>/dev/null; then
            sed -i.bak "s/id \"org.jetbrains.kotlin.android\" version \"[^\"]*\"/id \"org.jetbrains.kotlin.android\" version \"$KOTLIN_VERSION\"/; s/id 'org.jetbrains.kotlin.android' version '[^']*'/id 'org.jetbrains.kotlin.android' version '$KOTLIN_VERSION'/" android/settings.gradle
            echo "Updated kotlin plugin in settings.gradle"
          fi

      - name: Patch AndroidManifest (launcher mode + audio service + permissions)
        run: |
          python3 - <<'EOF'
          path = 'android/app/src/main/AndroidManifest.xml'
          s = open(path, encoding='utf-8').read()

          # --- permissions ---
          perms = '''    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
          '''
          if 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' not in s:
              # insert right after opening <manifest ...> tag
              idx = s.index('>') + 1
              s = s[:idx] + '\n' + perms + s[idx:]

          # --- launcher (HOME) categories ---
          if 'category.HOME' not in s:
              s = s.replace(
                  '<category android:name="android.intent.category.LAUNCHER" />',
                  '<category android:name="android.intent.category.LAUNCHER" />\n'
                  '                <category android:name="android.intent.category.HOME" />\n'
                  '                <category android:name="android.intent.category.DEFAULT" />'
              )

          # --- singleTask launch mode ---
          if 'launchMode' not in s:
              s = s.replace('<activity', '<activity\n                android:launchMode="singleTask"', 1)

          # --- audio service + receiver before </application> ---
          svc = '''
                  <service
                      android:name="com.ryanheise.audioservice.AudioService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="false" />
                  <receiver
                      android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MEDIA_BUTTON" />
                      </intent-filter>
                  </receiver>
              '''
          if 'audioservice.AudioService' not in s:
              s = s.replace('</application>', svc + '\n    </application>')

          open(path, 'w', encoding='utf-8').write(s)
          print('Manifest patched:')
          print(s)
          EOF

      - name: Update Kotlin Gradle plugin version (fallback for old-style projects)
        run: |
          if grep -q "ext.kotlin_version" android/build.gradle 2>/dev/null; then
            sed -i.bak "s/ext.kotlin_version *= *'[^']*'/ext.kotlin_version = '1.9.23'/" android/build.gradle
          fi

      - name: Fix asset paths in pubspec.yaml (find missing files and remap)
        run: |
          python3 - <<'EOF'
          import os, re

          pubspec_path = 'pubspec.yaml'
          pubspec = open(pubspec_path, encoding='utf-8').read()

          def resolve(path):
              if os.path.isfile(path):
                  return path
              base = os.path.basename(path)
              for root, dirs, files in os.walk('.'):
                  dirs[:] = [d for d in dirs if d not in ('.git', 'build', '.dart_tool', '.github')]
                  if base in files:
                      return os.path.normpath(os.path.join(root, base))
              return None

          changed = False

          def fix_line(m):
              global changed
              path = m.group(2).strip().strip('"\'')
              resolved = resolve(path)
              if resolved and resolved != path:
                  print(f"Remapped asset: {path} -> {resolved}")
                  changed = True
                  return f"{m.group(1)}{resolved}"
              if resolved is None:
                  os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
                  png = bytes.fromhex(
                      '89504e470d0a1a0a0000000d4948445200000001000000010806'
                      '0000001f15c4890000000d49444154789c6360000002000148'
                      'afa0720000000049454e44ae426082'
                  )
                  with open(path, 'wb') as f:
                      f.write(png)
                   print(f"Created placeholder asset: {path}")
