name: Build Tiba Launcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Recreate Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.tiba.launcher --project-name tiba_project

      - name: Inject Custom MainActivity for App Drawer
        run: |
          python3 - <<'EOF'
          import os

          # جستجو برای پیدا کردن مسیر پکیج کاتلین ساخته شده
          base_dir = 'android/app/src/main/kotlin'
          target_file = None
          for root, dirs, files in os.walk(base_dir):
              if 'MainActivity.kt' in files:
                  target_file = os.path.join(root, 'MainActivity.kt')
                  break

          if not target_file:
              target_file = 'android/app/src/main/kotlin/com/tiba/launcher/MainActivity.kt'
              os.makedirs(os.path.dirname(target_file), exist_ok=True)

          kotlin_code = '''package com.tiba.launcher

          import android.content.Intent
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.tiba.launcher/app"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "openApp" -> {
                              val packageName = call.argument<String>("package")
                              val intent = packageManager.getLaunchIntentForPackage(packageName ?: "")
                              if (intent != null) {
                                  startActivity(intent)
                                  result.success(true)
                              } else {
                                  result.error("UNAVAILABLE", "App not found", null)
                              }
                          }
                          "getInstalledApps" -> {
                              val pm = packageManager
                              val intent = Intent(Intent.ACTION_MAIN, null).addCategory(Intent.CATEGORY_LAUNCHER)
                              val resolveInfos = pm.queryIntentActivities(intent, 0)
                              val apps = mutableListOf<Map<String, String>>()
                              for (resolveInfo in resolveInfos) {
                                  apps.add(mapOf(
                                      "name" to resolveInfo.loadLabel(pm).toString(),
                                      "package" to resolveInfo.activityInfo.packageName
                                  ))
                              }
                              result.success(apps)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }
          }
          '''
          with open(target_file, 'w', encoding='utf-8') as f:
              f.write(kotlin_code)
          print(f"Injected MainActivity at: {target_file}")
          EOF

      - name: Patch Root and Plugin Gradle for Geolocator & SDK 35
        run: |
          python3 - <<'EOF'
          import os

          # ۱. اصلاح فایل android/build.gradle (ریشه پروژه)
          root_gradle = 'android/build.gradle'
          patch_block = """
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileSdkVersion 35
                          buildToolsVersion "35.0.0"
                          defaultConfig {
                              minSdkVersion 21
                              targetSdkVersion 35
                          }
                      }
                  }
              }
          }
          """
          with open(root_gradle, 'a', encoding='utf-8') as f:
              f.write(patch_block)

          # ۲. تنظیم compileSdk در android/app/build.gradle
          app_gradle = 'android/app/build.gradle'
          if os.path.exists(app_gradle):
              txt = open(app_gradle, encoding='utf-8').read()
              txt = txt.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 35')
              txt = txt.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 35')
              txt = txt.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
              open(app_gradle, 'w', encoding='utf-8').write(txt)

          print("Successfully patched root and app gradle.")
          EOF

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Build Launcher APK
        run: flutter build apk --release --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tiba2_Launcher_App
          path: build/app/outputs/flutter-apk/app-release.apk
