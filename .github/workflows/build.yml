name: Build Tiba Launcher

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable

      - name: Create Flutter Project
        run: |
          flutter create --org com.tiba2 tiba_project

          cd tiba_project

          cp ../pubspec.yaml pubspec.yaml
          cp ../lib/main.dart lib/main.dart

          if [ -f "../tiba2.png" ]; then
            cp ../tiba2.png ./
          fi

          if [ -f "../tiba2_rear.png" ]; then
            cp ../tiba2_rear.png ./
          fi

      - name: Configure Android Build
        run: |
          cd tiba_project

          echo "===== Gradle configuration ====="

          cat android/settings.gradle

          cat android/build.gradle

          echo "===== Configure Kotlin ====="

          sed -i -E \
            's/version "[0-9.]+"/version "1.9.22"/' \
            android/settings.gradle

          echo "===== Configure Android SDK ====="

          sed -i -E \
            's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' \
            android/app/build.gradle

          sed -i -E \
            's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/' \
            android/app/build.gradle

          sed -i -E \
            's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' \
            android/app/build.gradle

          sed -i -E \
            's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/' \
            android/app/build.gradle

          echo "===== Install Android SDK 34 ====="

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "===== Verify configuration ====="

          grep -n "kotlin.android" android/settings.gradle || true

          grep -n "compileSdk" android/app/build.gradle || true

          grep -n "targetSdk" android/app/build.gradle || true

      - name: Configure Android Manifest
        run: |
          cd tiba_project

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.QUERY_ALL_PACKAGES",
              "android.permission.READ_EXTERNAL_STORAGE",
              "android.permission.READ_MEDIA_AUDIO",
          ]

          for permission in permissions:
              tag = f'<uses-permission android:name="{permission}" />'
              if permission not in s:
                  s = s.replace("<application", tag + "\n    <application", 1)

          launcher = '<category android:name="android.intent.category.LAUNCHER" />'
          home = '<category android:name="android.intent.category.HOME" />'
          default = '<category android:name="android.intent.category.DEFAULT" />'

          if launcher in s:
              if home not in s:
                  s = s.replace(launcher, launcher + "\n                " + home, 1)
              if default not in s:
                  s = s.replace(launcher, launcher + "\n                " + default, 1)

          p.write_text(s)
          PY

      - name: Configure Vehicle Native Actions
        run: |
          cd tiba_project

          KT_PATH="android/app/src/main/kotlin/com/tiba2/tiba_project/MainActivity.kt"

          mkdir -p "$(dirname "$KT_PATH")"

          cat > "$KT_PATH" <<'EOF'
          package com.tiba2.tiba_project

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.location.Location
          import android.location.LocationListener
          import android.location.LocationManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.provider.Settings
          import android.view.KeyEvent
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity(), LocationListener {
              private val CHANNEL = "com.tiba2.launcher/actions"
              private var locationManager: LocationManager? = null
              private var methodChannel: MethodChannel? = null
              private val PERMISSION_REQUEST_CODE = 1001

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  methodChannel = MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      CHANNEL
                  )

                  methodChannel?.setMethodCallHandler { call, result ->
                      if (call.method != "open") {
                          result.notImplemented()
                          return@setMethodCallHandler
                      }

                      val action = call.argument<String>("action") ?: ""
                      val pkg = call.argument<String>("pkg") ?: ""

                      when (action) {
                          "settings" ->
                              tryLaunch(Intent(Settings.ACTION_SETTINGS), result)

                          "location_settings" ->
                              tryLaunch(
                                  Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS),
                                  result
                              )

                          "request_location" -> {
                              checkAndRequestLocation()
                              result.success(true)
                          }

                          "nav" -> {
                              var launched = false

                              if (pkg.isNotEmpty()) {
                                  launched = launchPackage(pkg)
                              }

                              if (!launched &&
                                  (pkg.contains("neshan") || pkg.isEmpty())) {
                                  launched =
                                      launchPackage("ir.neshan.sp") ||
                                      launchPackage("org.neshan.maps.and.navi")
                              }

                              if (!launched &&
                                  (pkg.contains("balad") || pkg.isEmpty())) {
                                  launched = launchPackage("ir.balad.navigation")
                              }

                              if (!launched) {
                                  try {
                                      val intent = Intent(
                                          Intent.ACTION_VIEW,
                                          Uri.parse("geo:0,0?q=")
                                      )
                                      val chooser = Intent.createChooser(
                                          intent,
                                          "انتخاب مسیریاب"
                                      )
                                      chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                      startActivity(chooser)
                                      result.success(true)
                                  } catch (e: Exception) {
                                      result.success(false)
                                  }
                              } else {
                                  result.success(true)
                              }
                          }

                          "radio" -> {
                              val packages = listOf(
                                  "com.syu.radio",
                                  "com.microntek.radio",
                                  "com.autochips.radio",
                                  "com.ts.fmradio",
                                  "com.tw.radio",
                                  "com.android.fmradio"
                              )

                              if (launchFirstAvailable(packages)) {
                                  result.success(true)
                              } else {
                                  tryLaunch(
                                      Intent(Intent.ACTION_MAIN).apply {
                                          addCategory(Intent.CATEGORY_APP_MUSIC)
                                      },
                                      result
                                  )
                              }
                          }

                          "phone" -> {
                              val packages = listOf(
                                  "com.syu.bt",
                                  "com.microntek.bluelet",
                                  "com.ts.bt",
                                  "com.tw.bt",
                                  "com.android.dialer"
                              )

                              if (launchFirstAvailable(packages)) {
                                  result.success(true)
                              } else {
                                  tryLaunch(Intent(Intent.ACTION_DIAL), result)
                              }
                          }

                          "apps" -> {
                              try {
                                  val intent = Intent(Intent.ACTION_MAIN).apply {
                                      addCategory(Intent.CATEGORY_LAUNCHER)
                                  }
                                  val chooser = Intent.createChooser(
                                      intent,
                                      "تمام برنامه‌ها"
                                  )
                                  chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  startActivity(chooser)
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.success(false)
                              }
                          }

                          "music" -> {
                              val packages = listOf(
                                  "com.syu.music",
                                  "com.microntek.music",
                                  "com.ts.music",
                                  "com.tw.music"
                              )

                              if (launchFirstAvailable(packages)) {
                                  result.success(true)
                              } else {
                                  tryLaunch(
                                      Intent(MediaStore.INTENT_ACTION_MUSIC_PLAYER),
                                      result
                                  )
                              }
                          }

                          "media_play_pause" -> {
                              sendMediaKeyEvent(KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE)
                              result.success(true)
                          }

                          "media_next" -> {
                              sendMediaKeyEvent(KeyEvent.KEYCODE_MEDIA_NEXT)
                              result.success(true)
                          }

                          "media_prev" -> {
                              sendMediaKeyEvent(KeyEvent.KEYCODE_MEDIA_PREVIOUS)
                              result.success(true)
                          }

                          else -> result.notImplemented()
                      }
                  }
              }

              private fun checkAndRequestLocation() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M &&
                      checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
                      != PackageManager.PERMISSION_GRANTED) {

                      requestPermissions(
                          arrayOf(
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION
                          ),
                          PERMISSION_REQUEST_CODE
                      )
                      return
                  }

                  startGpsTracking()
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      grantResults
                  )

                  if (requestCode == PERMISSION_REQUEST_CODE &&
                      grantResults.isNotEmpty() &&
                      grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      startGpsTracking()
                  }
              }

              private fun startGpsTracking() {
                  try {
                      locationManager =
                          getSystemService(Context.LOCATION_SERVICE) as LocationManager

                      locationManager?.requestLocationUpdates(
                          LocationManager.GPS_PROVIDER,
                          500L,
                          0f,
                          this
                      )

                      try {
                          locationManager?.requestLocationUpdates(
                              LocationManager.NETWORK_PROVIDER,
                              1000L,
                              0f,
                              this
                          )
                      } catch (_: Exception) {
                      }
                  } catch (e: SecurityException) {
                      e.printStackTrace()
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun sendMediaKeyEvent(keyCode: Int) {
                  val audioManager =
                      getSystemService(Context.AUDIO_SERVICE) as AudioManager

                  audioManager.dispatchMediaKeyEvent(
                      KeyEvent(KeyEvent.ACTION_DOWN, keyCode)
                  )

                  audioManager.dispatchMediaKeyEvent(
                      KeyEvent(KeyEvent.ACTION_UP, keyCode)
                  )
              }

              private fun launchPackage(pkg: String): Boolean {
                  return try {
                      val intent = packageManager.getLaunchIntentForPackage(pkg)

                      if (intent != null) {
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          startActivity(intent)
                          true
                      } else {
                          false
                      }
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun launchFirstAvailable(packages: List<String>): Boolean {
                  for (pkg in packages) {
                      if (launchPackage(pkg)) return true
                  }
                  return false
              }

              private fun tryLaunch(
                  intent: Intent,
                  result: MethodChannel.Result?
              ): Boolean {
                  return try {
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(intent)
                      result?.success(true)
                      true
                  } catch (e: Exception) {
                      result?.success(false)
                      false
                  }
              }

              override fun onLocationChanged(location: Location) {
                  val speedKmh = location.speed * 3.6f

                  runOnUiThread {
                      methodChannel?.invokeMethod("onSpeed", speedKmh)
                  }
              }

              @Deprecated("Deprecated in Android API")
              override fun onStatusChanged(
                  provider: String?,
                  status: Int,
                  extras: Bundle?
              ) {}

              override fun onProviderEnabled(provider: String) {}

              override fun onProviderDisabled(provider: String) {}
          }
          EOF

      - name: Resolve Flutter Dependencies
        run: |
          cd tiba_project
          flutter pub get

      - name: Build APK
        run: |
          cd tiba_project
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: Tiba2-Launcher-APK
          path: tiba_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
