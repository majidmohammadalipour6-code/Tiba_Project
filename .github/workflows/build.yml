name: Build Tiba Launcher APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Prepare Clean Project Structure
        run: |
          # ذخیره فایل اصلی شما در یک جای امن
          cp lib/main.dart user_main.dart
          
          # ساخت ساختار تمیز پروژه
          flutter create . --org com.tiba.launcher --project-name tiba_launcher
          
          # بازگرداندن کد اصلی داشبورد به جای کد پیش‌فرض
          cp user_main.dart lib/main.dart
          
          # حذف پوشه تست برای جلوگیری از خطای کامپایل
          rm -rf test
          
          # افزودن پکیج موقعیت مکانی جی‌پی‌اس
          flutter pub add geolocator

      - name: Set Permissions & Android Config
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' $MANIFEST
          
          GRADLE_FILE="android/app/build.gradle"
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' $GRADLE_FILE

      - name: Build Debug APK
        run: |
          flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tiba2-Launcher-GPS-Final
          path: build/app/outputs/flutter-apk/app-debug.apk
