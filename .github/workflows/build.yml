name: Build Tiba Launcher

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Create Flutter Project Structure if Missing
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            flutter create . --org com.tiba.launcher --project-name tiba2_launcher
          else
            flutter create . --org com.tiba.launcher --project-name tiba2_launcher --force
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
