name: Build Tiba Launcher APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Create and Setup Project
        run: |
          # 1. ساخت پروژه تمیز
          flutter create -t app --platforms=android --org com.tiba.launcher tiba_project
          cd tiba_project

          # 2. تزریق compileSdkVersion 35 به تمام پلاگین‌ها برای جلوگیری از ارور geolocator
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 35
                          if (project.android.hasProperty('compileOptions')) {
                              compileOptions {
                                  sourceCompatibility JavaVersion.VERSION_17
                                  targetCompatibility JavaVersion.VERSION_17
                              }
                          }
                      }
                  }
              }
          }
          EOF

          # 3. کپی فایل‌های پروژه شما
          cp ../lib/main.dart lib/main.dart
          cp ../pubspec.yaml pubspec.yaml
          if [ -f ../tiba2.png ]; then
            cp ../tiba2.png tiba2.png
          fi

          # 4. افزودن تگ‌های لانچر خودرو به AndroidManifest
          sed -i '/<category android:name="android.intent.category.LAUNCHER"\/>/a \                <category android:name="android.intent.category.HOME"\/>\n                <category android:name="android.intent.category.DEFAULT"\/>' android/app/src/main/AndroidManifest.xml

          # 5. دریافت وابستگی‌ها
          flutter pub get

      - name: Build APK
        run: |
          cd tiba_project
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tiba2-CyberHUD-Launcher
          path: tiba_project/build/app/outputs/flutter-apk/app-release.apk
