name: Build Flutter APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.x'
          channel: 'stable'

      - name: Create Flutter Project Structure
        run: |
          # پاک کردن موقت فایل‌های ورک‌فلو برای ساخت پروژه
          mkdir temp_lib
          cp lib/main.dart temp_lib/main.dart
          
          # ساخت پروژه جدید فلاتر در پوشه جاری
          flutter create . --org com.tiba.launcher --project-name tiba_project --force
          
          # برگرداندن فایل main.dart سفارشی خودمان
          mkdir -p lib
          cp temp_lib/main.dart lib/main.dart

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
