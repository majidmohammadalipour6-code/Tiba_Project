name: Build Tiba Launcher APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Base Project
        run: |
          flutter create --org com.tiba2 tiba_project
          cd tiba_project
          
          # کپی فایل‌های پروژه و عکس‌ها
          cp ../lib/main.dart lib/main.dart
          [ -f ../tiba2.png ] && cp ../tiba2.png .
          [ -f ../tiba2_rear.png ] && cp ../tiba2_rear.png .

          # تنظیم assets در pubspec.yaml
          cat << 'EOF' >> pubspec.yaml
            assets:
              - tiba2.png
              - tiba2_rear.png
          EOF

          # دسترسی‌های سخت‌افزاری GPS و تعریف لانچر رسمی
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<category android:name="android.intent.category.LAUNCHER"\/>/a \                <category android:name="android.intent.category.HOME"\/>\n                <category android:name="android.intent.category.DEFAULT"\/>' android/app/src/main/AndroidManifest.xml

          # جاگذاری MainActivity با شناساگر هوشمند پکیج‌های مانیتور خودرو
          cat << 'EOF' > android/app/src/main/kotlin/com/tiba2/tiba_project/MainActivity.kt
          package com.tiba2.tiba_project

          import android.content.Intent
          import android.net.Uri
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.tiba2.launcher/intent"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      val action = call.argument<String>("action")
                      val packageName = call.argument<String>("package")
                      val uriStr = call.argument<String>("uri")

                      try {
                          var intent: Intent? = null

                          // ۱. اگر پکیج مشخص ارسال شده باشد (مثل نشان یا برنامه‌های انتخابی)
                          if (!packageName.isNullOrEmpty()) {
                              intent = packageManager.getLaunchIntentForPackage(packageName)
                          }

                          // ۲. شناسایی هوشمند بر اساس اکشن دریافتی
                          if (intent == null && action != null) {
                              when {
                                  action.contains("SETTINGS") -> {
                                      // باز کردن تنظیمات اصلی دستگاه
                                      intent = Intent(Settings.ACTION_SETTINGS)
                                  }
                                  action.contains("DIAL") || action.contains("CALL") -> {
                                      // باز کردن شماره‌گیر
                                      intent = Intent(Intent.ACTION_DIAL)
                                  }
                                  action.contains("MUSIC") || action.contains("AUDIO") -> {
                                      // جستجو برای پلیر موزیک دستگاه
                                      val musicIntent = Intent(Intent.ACTION_MAIN).apply {
                                          addCategory(Intent.CATEGORY_APP_MUSIC)
                                      }
                                      intent = if (musicIntent.resolveActivity(packageManager) != null) {
                                          musicIntent
                                      } else {
                                          // اگر پلیر عمومی نبود، اولین برنامه موزیک/مدیا را پیدا کن
                                          findAppByKeywords(listOf("music", "player", "audio", "media"))
                                      }
                                  }
                                  action.contains("RADIO") -> {
                                      // جستجو برای رادیو مانیتور
                                      intent = findAppByKeywords(listOf("radio", "fm"))
                                  }
                                  else -> {
                                      intent = Intent(action)
                                  }
                              }
                          }

                          if (uriStr != null && intent != null) {
                              intent.data = Uri.parse(uriStr)
                          }

                          if (intent != null) {
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              startActivity(intent)
                              result.success(true)
                          } else {
                              result.success(false)
                          }
                      } catch (e: Exception) {
                          result.success(false)
                      }
                  }
              }

              // تابع کمکی برای پیدا کردن برنامه‌های فابریک مانیتور بر اساس کلمات کلیدی
              private fun findAppByKeywords(keywords: List<String>): Intent? {
                  val mainIntent = Intent(Intent.ACTION_MAIN, null).apply {
                      addCategory(Intent.CATEGORY_LAUNCHER)
                  }
                  val apps = packageManager.queryIntentActivities(mainIntent, 0)
                  for (app in apps) {
                      val pkg = app.activityInfo.packageName.lowercase()
                      val label = app.loadLabel(packageManager).toString().lowercase()
                      for (kw in keywords) {
                          if (pkg.contains(kw) || label.contains(kw)) {
                              return packageManager.getLaunchIntentForPackage(app.activityInfo.packageName)
                          }
                      }
                  }
                  return null
              }
          }
          EOF

      - name: Build APK
        run: |
          cd tiba_project
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: tiba_project/build/app/outputs/flutter-apk/app-release.apk
