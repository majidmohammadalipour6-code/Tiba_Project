name: Build Tiba Launcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Check & Fix Android Structure
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.tiba.launcher --project-name tiba_project
          fi

      - name: Ensure Assets Exist (Placeholder if missing)
        run: |
          if [ ! -f "tiba2.png" ]; then
            python3 -c "import base64; open('tiba2.png','wb').write(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='))"
          fi

      - name: Patch AndroidManifest
        run: |
          python3 - <<'EOF'
          path = 'android/app/src/main/AndroidManifest.xml'
          s = open(path, encoding='utf-8').read()

          perms = '''    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          '''
          if 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' not in s:
              idx = s.index('>') + 1
              s = s[:idx] + '\n' + perms + s[idx:]

          if 'category.HOME' not in s:
              s = s.replace(
                  '<category android:name="android.intent.category.LAUNCHER" />',
                  '<category android:name="android.intent.category.LAUNCHER" />\n'
                  '                <category android:name="android.intent.category.HOME" />\n'
                  '                <category android:name="android.intent.category.DEFAULT" />'
              )

          if 'launchMode' not in s:
              s = s.replace('<activity', '<activity\n                android:launchMode="singleTask"', 1)

          svc = '''
                  <service
                      android:name="com.ryanheise.audioservice.AudioService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="false" />
                  <receiver
                      android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MEDIA_BUTTON" />
                      </intent-filter>
                  </receiver>
              '''
          if 'audioservice.AudioService' not in s:
              s = s.replace('</application>', svc + '\n    </application>')

          open(path, 'w', encoding='utf-8').write(s)
          EOF

      - name: Fetch Dependencies
        run: |
          flutter pub get

      - name: Patch Cached Geolocator Plugin directly
        run: |
          python3 - <<'EOF'
          import glob
          import os

          # جستجو در تمام فایل‌های پکیج کش‌شده geolocator_android
          pattern = os.path.expanduser('~/.pub-cache/hosted/pub.dev/geolocator_android-*/android/build.gradle')
          files = glob.glob(pattern)

          for fpath in files:
              print(f"Patching: {fpath}")
              with open(fpath, 'r', encoding='utf-8') as f:
                  content = f.read()

              # جایگزین کردن هر خطی که به android.flutter وابسته است با مقادیر صریح و پایدار
              content = content.replace("compileSdkVersion project.android.flutter.compileSdkVersion", "compileSdkVersion 34")
              content = content.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 34")
              content = content.replace("targetSdkVersion flutter.targetSdkVersion", "targetSdkVersion 34")
              content = content.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")

              with open(fpath, 'w', encoding='utf-8') as f:
                  f.write(content)
          print("Geolocator patch successfully applied!")
          EOF

      - name: Set SDK Versions
        run: |
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties
          echo "flutter.compileSdkVersion=34" >> android/local.properties

      - name: Build Launcher APK
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tiba2_Launcher_App
          path: build/app/outputs/flutter-apk/app-release.apk
