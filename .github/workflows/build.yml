name: Build Tiba Launcher APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Base Project
        run: |
          flutter create --org com.tiba2 tiba_project
          cd tiba_project
          
          # کپی فایل‌های پروژه و عکس‌ها
          cp ../lib/main.dart lib/main.dart
          [ -f ../tiba2.png ] && cp ../tiba2.png .
          [ -f ../tiba2_rear.png ] && cp ../tiba2_rear.png .

          # تنظیم دارایی‌ها (assets) در pubspec.yaml
          cat << 'EOF' >> pubspec.yaml
            assets:
              - tiba2.png
              - tiba2_rear.png
          EOF

          # تبدیل اپلیکیشن به لانچر پیش‌فرض در AndroidManifest.xml
          sed -i '/<category android:name="android.intent.category.LAUNCHER"\/>/a \                <category android:name="android.intent.category.HOME"\/>\n                <category android:name="android.intent.category.DEFAULT"\/>' android/app/src/main/AndroidManifest.xml

          # فعال‌سازی کامل موتور اجرای اینتنت و باز کردن برنامه‌های خارجی (نشان، موزیک، تنظیمات و...)
          cat << 'EOF' > android/app/src/main/kotlin/com/tiba2/tiba_project/MainActivity.kt
          package com.tiba2.tiba_project

          import android.content.Intent
          import android.net.Uri
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.tiba2.launcher/intent"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "launchIntent") {
                          val action = call.argument<String>("action")
                          val uriStr = call.argument<String>("uri")
                          val packageName = call.argument<String>("package")
                          val category = call.argument<String>("category")

                          try {
                              val intent = if (packageName != null) {
                                  packageManager.getLaunchIntentForPackage(packageName) ?: Intent(action ?: Intent.ACTION_MAIN)
                              } else if (action != null) {
                                  Intent(action)
                              } else {
                                  Intent(Intent.ACTION_VIEW)
                              }

                              if (uriStr != null) {
                                  intent.data = Uri.parse(uriStr)
                              }
                              if (category != null) {
                                  intent.addCategory(category)
                              }

                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              startActivity(intent)
                              result.success(true)
                          } catch (e: Exception) {
                              result.success(false)
                          }
                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd tiba_project
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: tiba_project/build/app/outputs/flutter-apk/app-release.apk
