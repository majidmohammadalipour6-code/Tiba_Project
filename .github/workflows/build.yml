name: Build Tiba Launcher

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable

      - name: Create Flutter Project
        run: |
          flutter create --org com.tiba2 tiba_project

          cp pubspec.yaml tiba_project/pubspec.yaml
          cp lib/main.dart tiba_project/lib/main.dart

          cp tiba2.png tiba_project/tiba2.png
          cp tiba2_rear.png tiba_project/tiba2_rear.png

      - name: Configure Android Build
        run: |
          cd tiba_project

          SETTINGS="android/settings.gradle"
          APP_GRADLE="android/app/build.gradle"
          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"

          sed -i -E \
            's/(id "com\.android\.application" version ")[^"]+"/\18.3.2"/' \
            "$SETTINGS"

          sed -i -E \
            's/(id "org\.jetbrains\.kotlin\.android" version ")[^"]+"/\11.9.22"/' \
            "$SETTINGS"

          sed -i -E \
            's#gradle-[0-9.]+-all.zip#gradle-8.4-all.zip#' \
            "$WRAPPER"

          sed -i -E \
            's/compileSdk = flutter\.compileSdkVersion/compileSdk = 34/' \
            "$APP_GRADLE"

          sed -i -E \
            's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 34/' \
            "$APP_GRADLE"

          sed -i -E \
            's/targetSdk = flutter\.targetSdkVersion/targetSdk = 34/' \
            "$APP_GRADLE"

          sed -i -E \
            's/targetSdkVersion flutter\.targetSdkVersion/targetSdkVersion 34/' \
            "$APP_GRADLE"

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Configure Android Manifest
        run: |
          cd tiba_project

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          p = Path("android/app/src/main/AndroidManifest.xml")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")

          tree = ET.parse(p)
          root = tree.getroot()

          android = "{http://schemas.android.com/apk/res/android}"

          permissions = [
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.QUERY_ALL_PACKAGES",
              "android.permission.READ_EXTERNAL_STORAGE",
              "android.permission.READ_MEDIA_AUDIO",
              "android.permission.RECEIVE_BOOT_COMPLETED",
          ]

          existing = {
              item.get(android + "name")
              for item in root.findall("uses-permission")
          }

          for permission in permissions:
              if permission not in existing:
                  item = ET.Element(
                      "uses-permission",
                      {android + "name": permission}
                  )
                  root.insert(0, item)

          application = root.find("application")
          if application is None:
              raise RuntimeError("Android application element not found")

          activity = None
          for item in application.findall("activity"):
              name = item.get(android + "name", "")
              if name.endswith("MainActivity"):
                  activity = item
                  break

          if activity is None:
              raise RuntimeError("MainActivity not found")

          activity.set(android + "exported", "true")

          # Keep the normal app icon/launcher intent filter.
          # Add a separate HOME intent filter.
          has_home_filter = False

          for intent_filter in activity.findall("intent-filter"):
              actions = {
                  x.get(android + "name")
                  for x in intent_filter.findall("action")
              }
              categories = {
                  x.get(android + "name")
                  for x in intent_filter.findall("category")
              }

              if (
                  "android.intent.action.MAIN" in actions
                  and "android.intent.category.HOME" in categories
              ):
                  has_home_filter = True

          if not has_home_filter:
              intent_filter = ET.SubElement(activity, "intent-filter")
              ET.SubElement(
                  intent_filter,
                  "action",
                  {android + "name": "android.intent.action.MAIN"}
              )
              ET.SubElement(
                  intent_filter,
                  "category",
                  {android + "name": "android.intent.category.HOME"}
              )
              ET.SubElement(
                  intent_filter,
                  "category",
                  {android + "name": "android.intent.category.DEFAULT"}
              )

          # Add a receiver to start the launcher after device boot.
          receiver = None

          for item in application.findall("receiver"):
              if item.get(android + "name") == ".BootReceiver":
                  receiver = item
                  break

          if receiver is None:
              receiver = ET.SubElement(
                  application,
                  "receiver",
                  {
                      android + "name": ".BootReceiver",
                      android + "enabled": "true",
                      android + "exported": "true"
                  }
              )

          receiver_filter = None
          for item in receiver.findall("intent-filter"):
              if any(
                  action.get(android + "name")
                  == "android.intent.action.BOOT_COMPLETED"
                  for action in item.findall("action")
              ):
                  receiver_filter = item
                  break

          if receiver_filter is None:
              receiver_filter = ET.SubElement(receiver, "intent-filter")
              ET.SubElement(
                  receiver_filter,
                  "action",
                  {android + "name": "android.intent.action.BOOT_COMPLETED"}
              )

          p.write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              + ET.tostring(root, encoding="unicode")
          )
          PY

      - name: Create Boot Receiver
        run: |
          cd tiba_project

          KT_PATH="android/app/src/main/kotlin/com/tiba2/tiba_project"
          mkdir -p "$KT_PATH"

          cat > "$KT_PATH/BootReceiver.kt" <<'EOF'
          package com.tiba2.tiba_project

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (
                      intent.action == Intent.ACTION_BOOT_COMPLETED ||
                      intent.action == Intent.ACTION_LOCKED_BOOT_COMPLETED
                  ) {
                      val launchIntent =
                          context.packageManager.getLaunchIntentForPackage(
                              context.packageName
                          )

                      if (launchIntent != null) {
                          launchIntent.addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK or
                              Intent.FLAG_ACTIVITY_CLEAR_TOP
                          )

                          try {
                              context.startActivity(launchIntent)
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }
                      }
                  }
              }
          }
          EOF

      - name: Configure Vehicle Native Actions
        run: |
          cd tiba_project

          KT_PATH="android/app/src/main/kotlin/com/tiba2/tiba_project/MainActivity.kt"

          mkdir -p "$(dirname "$KT_PATH")"

          cat > "$KT_PATH" <<'EOF'
          package com.tiba2.tiba_project

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.location.Location
          import android.location.LocationListener
          import android.location.LocationManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.provider.Settings
          import android.view.KeyEvent
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity(), LocationListener {
              private val CHANNEL = "com.tiba2.launcher/actions"
              private var locationManager: LocationManager? = null
              private var methodChannel: MethodChannel? = null
              private val PERMISSION_REQUEST_CODE = 1001

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  methodChannel = MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      CHANNEL
                  )

                  methodChannel?.setMethodCallHandler { call, result ->
                      if (call.method != "open") {
                          result.notImplemented()
                          return@setMethodCallHandler
                      }

                      val action = call.argument<String>("action") ?: ""
                      val pkg = call.argument<String>("pkg") ?: ""

                      when (action) {
                          "settings" -> tryLaunch(Intent(Settings.ACTION_SETTINGS), result)

                          "location_settings" -> tryLaunch(
                              Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS),
                              result
                          )

                          "request_location" -> {
                              checkAndRequestLocation()
                              result.success(true)
                          }

                          "nav" -> {
                              val launched = if (pkg.isNotEmpty()) {
                                  launchPackage(pkg)
                              } else {
                                  launchPackage("ir.neshan.sp") ||
                                  launchPackage("ir.balad.navigation") ||
                                  launchPackage("com.google.android.apps.maps")
                              }

                              if (!launched) {
                                  try {
                                      val intent = Intent(
                                          Intent.ACTION_VIEW,
                                          Uri.parse("geo:0,0?q=")
                                      )
                                      startActivity(
                                          Intent.createChooser(intent, "انتخاب مسیریاب")
                                      )
                                      result.success(true)
                                  } catch (e: Exception) {
                                      result.success(false)
                                  }
                              } else {
                                  result.success(true)
                              }
                          }

                          "radio" -> {
                              val packages = listOf(
                                  "com.syu.radio",
                                  "com.microntek.radio",
                                  "com.autochips.radio",
                                  "com.ts.fmradio",
                                  "com.tw.radio",
                                  "com.android.fmradio"
                              )

                              if (launchFirstAvailable(packages)) {
                                  result.success(true)
                              } else {
                                  tryLaunch(
                                      Intent(Intent.ACTION_MAIN).addCategory(
                                          Intent.CATEGORY_APP_MUSIC
                                      ),
                                      result
                                  )
                              }
                          }

                          "phone" -> {
                              val packages = listOf(
                                  "com.syu.bt",
                                  "com.microntek.bluelet",
                                  "com.ts.bt",
                                  "com.tw.bt",
                                  "com.android.dialer"
                              )

                              if (launchFirstAvailable(packages)) {
                                  result.success(true)
                              } else {
                                  tryLaunch(Intent(Intent.ACTION_DIAL), result)
                              }
                          }

                          "apps" -> {
                              try {
                                  val intent = Intent(Intent.ACTION_MAIN).apply {
                                      addCategory(Intent.CATEGORY_LAUNCHER)
                                  }
                                  startActivity(
                                      Intent.createChooser(intent, "برنامه‌ها")
                                  )
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.success(false)
                              }
                          }

                          "music" -> {
                              val packages = listOf(
                                  "com.syu.music",
                                  "com.microntek.music",
                                  "com.ts.music",
                                  "com.tw.music"
                              )

                              if (launchFirstAvailable(packages)) {
                                  result.success(true)
                              } else {
                                  tryLaunch(
                                      Intent(MediaStore.INTENT_ACTION_MUSIC_PLAYER),
                                      result
                                  )
                              }
                          }

                          "media_play_pause" -> {
                              sendMediaKeyEvent(KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE)
                              result.success(true)
                          }

                          "media_next" -> {
                              sendMediaKeyEvent(KeyEvent.KEYCODE_MEDIA_NEXT)
                              result.success(true)
                          }

                          "media_prev" -> {
                              sendMediaKeyEvent(KeyEvent.KEYCODE_MEDIA_PREVIOUS)
                              result.success(true)
                          }

                          else -> result.notImplemented()
                      }
                  }
              }

              private fun checkAndRequestLocation() {
                  if (
                      Build.VERSION.SDK_INT >= Build.VERSION_CODES.M &&
                      checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) !=
                      PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(
                          arrayOf(
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION
                          ),
                          PERMISSION_REQUEST_CODE
                      )
                      return
                  }

                  startGpsTracking()
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      grantResults
                  )

                  if (
                      requestCode == PERMISSION_REQUEST_CODE &&
                      grantResults.isNotEmpty() &&
                      grantResults[0] == PackageManager.PERMISSION_GRANTED
                  ) {
                      startGpsTracking()
                  }
              }

              private fun startGpsTracking() {
                  try {
                      locationManager =
                          getSystemService(Context.LOCATION_SERVICE) as LocationManager

                      locationManager?.requestLocationUpdates(
                          LocationManager.GPS_PROVIDER,
                          500L,
                          0f,
                          this
                      )
                  } catch (e: SecurityException) {
                      e.printStackTrace()
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun sendMediaKeyEvent(keyCode: Int) {
                  val audioManager =
                      getSystemService(Context.AUDIO_SERVICE) as AudioManager

                  audioManager.dispatchMediaKeyEvent(
                      KeyEvent(KeyEvent.ACTION_DOWN, keyCode)
                  )
                  audioManager.dispatchMediaKeyEvent(
                      KeyEvent(KeyEvent.ACTION_UP, keyCode)
                  )
              }

              private fun launchPackage(pkg: String): Boolean {
                  return try {
                      val intent = packageManager.getLaunchIntentForPackage(pkg)
                      if (intent != null) {
                          startActivity(intent)
                          true
                      } else {
                          false
                      }
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun launchFirstAvailable(packages: List<String>): Boolean {
                  for (pkg in packages) {
                      if (launchPackage(pkg)) return true
                  }
                  return false
              }

              private fun tryLaunch(
                  intent: Intent,
                  result: MethodChannel.Result
              ) {
                  try {
                      startActivity(intent)
                      result.success(true)
                  } catch (e: Exception) {
                      result.success(false)
                  }
              }

              override fun onLocationChanged(location: Location) {
                  val speedKmh = location.speed * 3.6f
                  runOnUiThread {
                      methodChannel?.invokeMethod("onSpeed", speedKmh)
                  }
              }

              @Deprecated("Deprecated in Android API")
              override fun onStatusChanged(
                  provider: String?,
                  status: Int,
                  extras: Bundle?
              ) {}

              override fun onProviderEnabled(provider: String) {}
              override fun onProviderDisabled(provider: String) {}
          }
          EOF

      - name: Resolve Flutter Dependencies
        run: |
          cd tiba_project
          flutter pub get

      - name: Build APK
        run: |
          cd tiba_project
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: Tiba2-Launcher-APK
          path: tiba_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
