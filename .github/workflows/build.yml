name: Build Tiba Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Create Fresh Flutter Project
        run: |
          # ساخت یک پروژه موقت فلاتر با نام صحیح
          flutter create temp_app --org com.tiba.launcher --platforms=android
          
          # انتقال پوشه اندروید و pubspec به پوشه اصلی ریپازیتوری
          cp temp_app/pubspec.yaml ./pubspec.yaml
          cp -r temp_app/android ./android
          
          # پاک کردن پوشه موقت
          rm -rf temp_app

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tiba2-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
