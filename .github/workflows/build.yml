name: Build Tiba Launcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Clean Old Android Folder and Lock File
        run: |
          rm -rf android pubspec.lock
          echo "Cleaned old android/ and pubspec.lock"

      - name: Create Fresh Android Platform
        run: |
          flutter create . --platforms=android --org com.tiba.launcher --project-name tiba_project
          flutter doctor -v

      - name: Inject Custom MainActivity for App Drawer
        run: |
          python3 - <<'EOF'
          import os

          main_activity_path = 'android/app/src/main/kotlin/com/tiba/launcher/tiba_project/MainActivity.kt'
          # مسیر پیش‌فرض flutter create
          alt_path = 'android/app/src/main/kotlin/com/tiba/launcher/MainActivity.kt'
          target = main_activity_path if os.path.isdir(os.path.dirname(main_activity_path)) else alt_path
          os.makedirs(os.path.dirname(target), exist_ok=True)

          kotlin_code = '''package com.tiba.launcher

          import android.content.Intent
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.tiba.launcher/app"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "openApp" -> {
                              val packageName = call.argument<String>("package")
                              val intent = packageManager.getLaunchIntentForPackage(packageName ?: "")
                              if (intent != null) {
                                  startActivity(intent)
                                  result.success(true)
                              } else {
                                  result.error("UNAVAILABLE", "App not found", null)
                              }
                          }
                          "getInstalledApps" -> {
                              val pm = packageManager
                              val intent = Intent(Intent.ACTION_MAIN, null).addCategory(Intent.CATEGORY_LAUNCHER)
                              val resolveInfos = pm.queryIntentActivities(intent, 0)
                              val apps = mutableListOf<Map<String, String>>()
                              for (resolveInfo in resolveInfos) {
                                  apps.add(mapOf(
                                      "name" to resolveInfo.loadLabel(pm).toString(),
                                      "package" to resolveInfo.activityInfo.packageName
                                  ))
                              }
                              result.success(apps)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }
          }
          '''
          with open(target, 'w', encoding='utf-8') as f:
              f.write(kotlin_code)
          print("MainActivity.kt injected at:", target)
          EOF

      - name: Force SDK 35 in Gradle Files
        run: |
          python3 - <<'EOF'
          import re, os

          # فایل گرید اپلیکیشن
          p = 'android/app/build.gradle'
          c = open(p, encoding='utf-8').read()
          c = re.sub(r'compileSdk\s*=\s*[^ \n]+', 'compileSdk = 35', c)
          c = re.sub(r'compileSdkVersion\s+[^ \n]+', 'compileSdkVersion 35', c)
          c = re.sub(r'targetSdk\s*=\s*[^ \n]+', 'targetSdk = 35', c)
          c = re.sub(r'targetSdkVersion\s+[^ \n]+', 'targetSdkVersion 35', c)
          c = re.sub(r'minSdk\s*=\s*[^ \n]+', 'minSdk = 21', c)
          c = re.sub(r'minSdkVersion\s+[^ \n]+', 'minSdkVersion 21', c)
          open(p, 'w', encoding='utf-8').write(c)

          # gradle.properties برای سازگاری Kotlin 2.1
          gp = 'android/gradle.properties'
          g = open(gp, encoding='utf-8').read()
          if 'flutter.minSdkVersion' not in g:
              g += "\nflutter.minSdkVersion=21\nflutter.targetSdkVersion=35\nflutter.compileSdkVersion=35\n"
              open(gp, 'w', encoding='utf-8').write(g)
          print("Gradle SDK settings forced to 35.")
          EOF

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Build Launcher APK
        run: flutter build apk --release --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tiba2_Launcher_App
          path: build/app/outputs/flutter-apk/app-release.apk
