name: Build Tiba Launcher

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable

      - name: Create Flutter Project
        run: |
          flutter create --org com.tiba2 tiba_project
          cd tiba_project

          cp ../lib/main.dart lib/main.dart

          if [ -f "../tiba2.png" ]; then
            cp ../tiba2.png ./
          fi

          if [ -f "../tiba2_rear.png" ]; then
            cp ../tiba2_rear.png ./
          fi

          cat >> pubspec.yaml <<'EOF'
            assets:
              - tiba2.png
              - tiba2_rear.png
          EOF

      - name: Configure Android Manifest
        run: |
          cd tiba_project

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>\n    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"\/>\n    <application/' "$MANIFEST"

          sed -i 's/<category android:name="android.intent.category.LAUNCHER"\/>/<category android:name="android.intent.category.LAUNCHER"\/>\n                <category android:name="android.intent.category.HOME"\/>\n                <category android:name="android.intent.category.DEFAULT"\/>/' "$MANIFEST"

      - name: Configure Complete Vehicle Native Actions
        run: |
          cd tiba_project

          KT_PATH="android/app/src/main/kotlin/com/tiba2/tiba_project/MainActivity.kt"
          mkdir -p "$(dirname "$KT_PATH")"

          cat > "$KT_PATH" <<'EOF'
          package com.tiba2.tiba_project

          import android.Manifest
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.location.Location
          import android.location.LocationListener
          import android.location.LocationManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.SystemClock
          import android.provider.MediaStore
          import android.provider.Settings
          import android.view.KeyEvent
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity(), LocationListener {
              private val CHANNEL = "com.tiba2.launcher/actions"
              private var locationManager: LocationManager? = null
              private var methodChannel: MethodChannel? = null
              private val PERMISSION_REQUEST_CODE = 1001

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  methodChannel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)
                  methodChannel?.setMethodCallHandler { call, result ->
                      if (call.method == "open") {
                          val action = call.argument<String>("action") ?: ""
                          val pkg = call.argument<String>("pkg") ?: ""

                          when (action) {
                              "settings" -> {
                                  tryLaunch(Intent(Settings.ACTION_SETTINGS), result)
                              }
                              "location_settings" -> {
                                  tryLaunch(Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS), result)
                              }
                              "request_location" -> {
                                  checkAndRequestLocation()
                                  result.success(true)
                              }
                              "nav" -> {
                                  var launched = false
                                  if (pkg.isNotEmpty() && launchPackage(pkg)) {
                                      launched = true
                                  }
                                  if (!launched && (pkg.contains("neshan") || pkg.isEmpty())) {
                                      launched = launchPackage("ir.neshan.sp") || launchPackage("org.neshan.maps.and.navi")
                                  }
                                  if (!launched && (pkg.contains("balad") || pkg.isEmpty())) {
                                      launched = launchPackage("ir.balad.navigation")
                                  }
                                  if (!launched) {
                                      val mapIntent = Intent(Intent.ACTION_VIEW, Uri.parse("geo:0,0?q=")).apply {
                                          flags = Intent.FLAG_ACTIVITY_NEW_TASK
                                      }
                                      try {
                                          val chooser = Intent.createChooser(mapIntent, "انتخاب مسیریاب")
                                          chooser.flags = Intent.FLAG_ACTIVITY_NEW_TASK
                                          startActivity(chooser)
                                          result.success(true)
                                      } catch (e: Exception) {
                                          result.success(false)
                                      }
                                  } else {
                                      result.success(true)
                                  }
                              }
                              "radio" -> {
                                  val radioPackages = listOf(
                                      "com.syu.radio",
                                      "com.microntek.radio",
                                      "com.autochips.radio",
                                      "com.ts.fmradio",
                                      "com.tw.radio",
                                      "com.ankai.cardvd.radio",
                                      "com.hcn.radio",
                                      "com.android.fmradio",
                                      "com.car.radio",
                                      "com.forfan.fmradio"
                                  )
                                  var launched = launchFirstAvailable(radioPackages)
                                  if (!launched) {
                                      val radioActions = listOf(
                                          "android.intent.action.MAIN_RADIO",
                                          "com.microntek.radio",
                                          "com.syu.radio"
                                      )
                                      for (act in radioActions) {
                                          try {
                                              val intent = Intent(act).apply { flags = Intent.FLAG_ACTIVITY_NEW_TASK }
                                              startActivity(intent)
                                              launched = true
                                              break
                                          } catch (e: Exception) {}
                                      }
                                  }
                                  if (!launched) {
                                      tryLaunch(Intent(Intent.ACTION_MAIN).also { it.addCategory(Intent.CATEGORY_APP_MUSIC) }, result)
                                  } else {
                                      result.success(true)
                                  }
                              }
                              "phone" -> {
                                  val phonePackages = listOf(
                                      "com.syu.bt",
                                      "com.microntek.bluelet",
                                      "com.ts.bt",
                                      "com.tw.bt",
                                      "com.android.dialer"
                                  )
                                  var launched = launchFirstAvailable(phonePackages)
                                  if (!launched) {
                                      val intent = Intent(Intent.ACTION_DIAL).apply { flags = Intent.FLAG_ACTIVITY_NEW_TASK }
                                      tryLaunch(intent, result)
                                  } else {
                                      result.success(true)
                                  }
                              }
                              "apps" -> {
                                  try {
                                      val intent = Intent(Intent.ACTION_MAIN).apply {
                                          addCategory(Intent.CATEGORY_LAUNCHER)
                                          flags = Intent.FLAG_ACTIVITY_NEW_TASK
                                      }
                                      val chooser = Intent.createChooser(intent, "تمام برنامه‌ها")
                                      chooser.flags = Intent.FLAG_ACTIVITY_NEW_TASK
                                      startActivity(chooser)
                                      result.success(true)
                                  } catch (e: Exception) {
                                      result.success(false)
                                  }
                              }
                              "music" -> {
                                  val musicPackages = listOf(
                                      "com.syu.music",
                                      "com.microntek.music",
                                      "com.ts.music",
                                      "com.tw.music",
                                      "com.autochips.music",
                                      "com.android.music"
                                  )
                                  val launched = launchFirstAvailable(musicPackages)
                                  if (!launched) {
                                      tryLaunch(Intent(MediaStore.INTENT_ACTION_MUSIC_PLAYER), result)
                                  } else {
                                      result.success(true)
                                  }
                              }
                              "media_play_pause" -> {
                                  sendMediaKeyEvent(KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE)
                                  result.success(true)
                              }
                              "media_next" -> {
                                  sendMediaKeyEvent(KeyEvent.KEYCODE_MEDIA_NEXT)
                                  result.success(true)
                              }
                              "media_prev" -> {
                                  sendMediaKeyEvent(KeyEvent.KEYCODE_MEDIA_PREVIOUS)
                                  result.success(true)
                              }
                              else -> result.notImplemented()
                          }
                      } else {
                          result.notImplemented()
                      }
                  }
              }

              private fun checkAndRequestLocation() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(arrayOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION), PERMISSION_REQUEST_CODE)
                          return
                      }
                  }
                  startGpsTracking()
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == PERMISSION_REQUEST_CODE && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      startGpsTracking()
                  }
              }

              private fun startGpsTracking() {
                  try {
                      locationManager = getSystemService(Context.LOCATION_SERVICE) as LocationManager
                      locationManager?.requestLocationUpdates(LocationManager.GPS_PROVIDER, 500L, 0f, this)
                      locationManager?.requestLocationUpdates(LocationManager.NETWORK_PROVIDER, 1000L, 0f, this)
                  } catch (e: SecurityException) {
                      e.printStackTrace()
                  }
              }

              private fun sendMediaKeyEvent(keyCode: Int) {
                  val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  val eventDown = KeyEvent(KeyEvent.ACTION_DOWN, keyCode)
                  val eventUp = KeyEvent(KeyEvent.ACTION_UP, keyCode)
                  audioManager.dispatchMediaKeyEvent(eventDown)
                  audioManager.dispatchMediaKeyEvent(eventUp)
              }

              private fun launchPackage(pkg: String): Boolean {
                  return try {
                      val intent = packageManager.getLaunchIntentForPackage(pkg)
                      if (intent != null) {
                          intent.flags = Intent.FLAG_ACTIVITY_NEW_TASK
                          startActivity(intent)
                          true
                      } else {
                          false
                      }
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun launchFirstAvailable(packages: List<String>): Boolean {
                  for (pkg in packages) {
                      if (launchPackage(pkg)) return true
                  }
                  return false
              }

              private fun tryLaunch(intent: Intent, result: MethodChannel.Result?): Boolean {
                  return try {
                      intent.flags = Intent.FLAG_ACTIVITY_NEW_TASK
                      startActivity(intent)
                      result?.success(true)
                      true
                  } catch (e: Exception) {
                      result?.success(false)
                      false
                  }
              }

              override fun onLocationChanged(location: Location) {
                  val speedKmh = location.speed * 3.6f
                  runOnUiThread {
                      methodChannel?.invokeMethod("onSpeed", speedKmh)
                  }
              }

              override fun onStatusChanged(provider: String?, status: Int, extras: Bundle?) {}
              override fun onProviderEnabled(provider: String) {}
              override fun onProviderDisabled(provider: String) {}
          }
          EOF

      - name: Build APK
        run: |
          cd tiba_project
          flutter build apk --release

      - name: Upload Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: Tiba2-Launcher-APK
          path: tiba_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
