name: Build Flutter APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.x'
          channel: 'stable'

      - name: Setup Project Structure
        run: |
          # ذخیره کردن فایل main.dart کاربر
          mkdir -p /tmp/my_lib
          cp lib/main.dart /tmp/my_lib/main.dart
          
          # ساخت پروژه موقت در یک پوشه دیگر
          flutter create temp_app --org com.tiba.launcher --project-name tiba_project
          
          # انتقال فایل‌ها و پوشه‌های ضروری به ریشه اصلی مخزن
          cp -r temp_app/android .
          cp -r temp_app/ios .
          cp -r temp_app/web .
          cp -r temp_app/lib .
          cp temp_app/pubspec.yaml .
          cp temp_app/analysis_options.yaml .
          
          # جایگزین کردن فایل main.dart سفارشی شما
          cp /tmp/my_lib/main.dart lib/main.dart

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
