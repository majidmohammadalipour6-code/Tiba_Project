name: Build Tiba Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Create Clean Flutter Project Scaffolding
        run: |
          flutter create temp_app --org com.tiba.launcher --project-name tiba_launcher
          rm -rf temp_app/lib/main.dart temp_app/pubspec.yaml
          cp -r lib temp_app/
          cp pubspec.yaml temp_app/
          cd temp_app
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tiba2-Debug-APK
          path: temp_app/build/app/outputs/flutter-apk/app-debug.apk
