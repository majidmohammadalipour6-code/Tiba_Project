name: Build Tiba Project APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.6'
          channel: 'stable'
          cache: true

      - name: Build Clean Flutter Project
        run: |
          # ذخیره فایل‌های lib و pubspec در مکانی امن
          mkdir -p /tmp/user_code
          if [ -d "lib" ]; then cp -r lib/* /tmp/user_code/; fi
          if [ -f "pubspec.yaml" ]; then cp pubspec.yaml /tmp/user_code/; fi
          
          # پاکسازی فایل‌های قبلی مخزن برای جلوگیری از تداخل
          rm -rf ./* ./.github
          
          # ساخت یک پروژه فلاتر کاملاً تازه و استاندارد
          flutter create . --org com.tiba.project --project-name tiba_project --platforms android
          
          # بازگرداندن کدهای شما به پروژه تازه ساخته شده
          if [ -d "/tmp/user_code/lib" ]; then cp -r /tmp/user_code/lib/* lib/; fi
          if [ -f "/tmp/user_code/pubspec.yaml" ]; then cp /tmp/user_code/pubspec.yaml pubspec.yaml; fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug --no-tree-shake-icons
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tiba-Dashboard-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
