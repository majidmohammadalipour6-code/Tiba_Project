name: Build Tiba Launcher APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Base Project
        run: |
          flutter create --org com.tiba2 tiba_project
          cd tiba_project
          
          # کپی فایل‌های اصلی و عکس‌ها
          cp ../lib/main.dart lib/main.dart
          [ -f ../tiba2.png ] && cp ../tiba2.png .
          [ -f ../tiba2_rear.png ] && cp ../tiba2_rear.png .

          # تنظیم assets
          cat << 'EOF' >> pubspec.yaml
            assets:
              - tiba2.png
              - tiba2_rear.png
          EOF

          # اضافه کردن مجوزهای مانیفست (GPS + دیدن کل برنامه‌های مانیتور QUERY_ALL_PACKAGES)
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>\n    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" \/>' android/app/src/main/AndroidManifest.xml
          
          # تعریف تگ لانچر رسمی اندروید
          sed -i '/<category android:name="android.intent.category.LAUNCHER"\/>/a \                <category android:name="android.intent.category.HOME"\/>\n                <category android:name="android.intent.category.DEFAULT"\/>' android/app/src/main/AndroidManifest.xml

          # کد اجرایی بدون باگ اینتنت‌ها در کاتلین
          cat << 'EOF' > android/app/src/main/kotlin/com/tiba2/tiba_project/MainActivity.kt
          package com.tiba2.tiba_project

          import android.content.Intent
          import android.net.Uri
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.tiba2.launcher/intent"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      val action = call.argument<String>("action")
                      val packageName = call.argument<String>("package")
                      val uriStr = call.argument<String>("uri")

                      try {
                          var intent: Intent? = null

                          // اولویت اول: اگر پکیج فرستاده شده (نشان، بلد، گوگل مپ)
                          if (!packageName.isNullOrEmpty()) {
                              intent = packageManager.getLaunchIntentForPackage(packageName)
                          }

                          // اولویت دوم: بر اساس نوع درخواست دکمه‌ها
                          if (intent == null && action != null) {
                              if (action == "android.settings.SETTINGS" || action.contains("SETTINGS")) {
                                  // تنظیمات عمومی خود مانیتور
                                  intent = Intent(Settings.ACTION_SETTINGS)
                              } else if (action.contains("DIAL") || action.contains("CALL")) {
                                  // دکمه تماس / شماره‌گیر
                                  intent = Intent(Intent.ACTION_DIAL)
                              } else if (action.contains("LOCATION")) {
                                  // تنظیمات GPS
                                  intent = Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS)
                              } else {
                                  intent = Intent(action)
                              }
                          }

                          // در صورتی که پلیر یا رادیو بود و پکیج مستقیم نداشت
                          if (intent == null && action != null && (action.contains("MUSIC") || action.contains("RADIO"))) {
                              val pm = packageManager
                              val allApps = pm.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0)
                              for (ri in allApps) {
                                  val pName = ri.activityInfo.packageName.lowercase()
                                  if (pName.contains("music") || pName.contains("media") || pName.contains("audio") || pName.contains("radio")) {
                                      intent = pm.getLaunchIntentForPackage(ri.activityInfo.packageName)
                                      break
                                  }
                              }
                          }

                          if (intent != null) {
                              if (uriStr != null) {
                                  intent.data = Uri.parse(uriStr)
                              }
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              startActivity(intent)
                              result.success(true)
                          } else {
                              // اگر هیچی پیدا نشد، تنظیمات کلی باز شود نه صفحه اعلان‌ها!
                              val fallbackIntent = Intent(Settings.ACTION_SETTINGS).apply {
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              }
                              startActivity(fallbackIntent)
                              result.success(true)
                          }
                      } catch (e: Exception) {
                          result.success(false)
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd tiba_project
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: tiba_project/build/app/outputs/flutter-apk/app-release.apk
