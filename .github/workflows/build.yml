name: Build Tiba Launcher APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Build Standalone App
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --org com.tiba.launcher --project-name tiba_launcher .
          rm -rf test
          cp -f ../lib/main.dart lib/main.dart
          flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tiba2-Launcher-Final
          path: temp_app/build/app/outputs/flutter-apk/app-debug.apk
