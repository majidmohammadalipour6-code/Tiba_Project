name: Build Tiba Project APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Recreate Project Structure
        run: |
          mkdir -p /tmp/backup
          if [ -d "lib" ]; then cp -r lib /tmp/backup/; fi

          find . -maxdepth 1 ! -name '.github' ! -name '.' -exec rm -rf {} +

          flutter create . --org com.tiba.project --project-name tiba_project --platforms android

          if [ -d "/tmp/backup/lib" ]; then cp -r /tmp/backup/lib/* lib/; fi

          cat << 'EOF' > pubspec.yaml
          name: tiba_project
          description: "Tiba 2 Cockpit HUD Launcher"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            geolocator: ^11.0.0
            url_launcher: ^6.2.5

          flutter:
            uses-material-design: true
          EOF

          if [ -f "android/build.gradle" ]; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.22"/' android/build.gradle
          fi
          if [ -f "android/settings.gradle" ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Split Release APKs
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tiba-Dashboard-APKs
          path: build/app/outputs/flutter-apk/*.apk
