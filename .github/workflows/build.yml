name: Build Tiba Launcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create and Build Project
        run: |
          # ساخت پروژه پایه با ساختار استاندارد
          flutter create --org com.tiba2 tiba_project
          cd tiba_project
          flutter pub add geolocator:^13.0.2
          # کپی فایل رابط کاربری و تصاویر خودرو
          cp ../lib/main.dart lib/main.dart
          if [ -f "../tiba2.png" ]; then cp ../tiba2.png ./; fi
          if [ -f "../tiba2_rear.png" ]; then cp ../tiba2_rear.png ./; fi

          # تنظیم دارایی‌ها (assets) در pubspec.yaml
          cat << 'EOF' >> pubspec.yaml
            assets:
              - tiba2.png
              - tiba2_rear.png
          EOF

          # تزریق کدهای نیتیو اندروید برای دریافت و اجرای کلیدها
          KT_PATH="android/app/src/main/kotlin/com/tiba2/tiba_project/MainActivity.kt"
          mkdir -p $(dirname $KT_PATH)
          cat << 'EOF' > $KT_PATH
          package com.tiba2.tiba_project

          import android.content.Intent
          import android.net.Uri
          import android.provider.Settings
          import android.view.KeyEvent
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.tiba2.launcher/actions"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                super.configureFlutterEngine(flutterEngine)
                MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                  val action = call.argument<String>("action") ?: ""
                  val pkg = call.argument<String>("pkg") ?: ""

                  try {
                    when (action) {
                      "settings" -> {
                        startActivity(Intent(Settings.ACTION_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                      }
                      "location_settings" -> {
                        startActivity(Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                      }
                      "apps" -> {
                        val intent = packageManager.getLaunchIntentForPackage("com.android.launcher3")
                            ?: Intent(Intent.ACTION_MAIN).apply { addCategory(Intent.CATEGORY_LAUNCHER) }
                        startActivity(intent.apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                      }
                      "phone" -> {
                        startActivity(Intent(Intent.ACTION_DIAL).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                      }
                      "radio" -> {
                        val launchIntent = packageManager.getLaunchIntentForPackage("com.microntek.radio") 
                            ?: packageManager.getLaunchIntentForPackage("com.hcn.radio")
                        if (launchIntent != null) {
                            startActivity(launchIntent)
                        } else {
                            startActivity(Intent(Intent.ACTION_MAIN).apply {
                                addCategory(Intent.CATEGORY_APP_MUSIC)
                                addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                            })
                        }
                      }
                      "music" -> {
                        startActivity(Intent(Intent.ACTION_MAIN).apply {
                          addCategory(Intent.CATEGORY_APP_MUSIC)
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                        })
                      }
                      "media_play_pause" -> {
                        val i = Intent(Intent.ACTION_MEDIA_BUTTON)
                        i.putExtra(Intent.EXTRA_KEY_EVENT, KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE))
                        sendOrderedBroadcast(i, null)
                        i.putExtra(Intent.EXTRA_KEY_EVENT, KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE))
                        sendOrderedBroadcast(i, null)
                      }
                      "media_next" -> {
                        val i = Intent(Intent.ACTION_MEDIA_BUTTON)
                        i.putExtra(Intent.EXTRA_KEY_EVENT, KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_MEDIA_NEXT))
                        sendOrderedBroadcast(i, null)
                        i.putExtra(Intent.EXTRA_KEY_EVENT, KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_MEDIA_NEXT))
                        sendOrderedBroadcast(i, null)
                      }
                      "media_prev" -> {
                        val i = Intent(Intent.ACTION_MEDIA_BUTTON)
                        i.putExtra(Intent.EXTRA_KEY_EVENT, KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_MEDIA_PREVIOUS))
                        sendOrderedBroadcast(i, null)
                        i.putExtra(Intent.EXTRA_KEY_EVENT, KeyEvent(KeyEvent.ACTION_UP, KeyEvent.KEYCODE_MEDIA_PREVIOUS))
                        sendOrderedBroadcast(i, null)
                      }
                      "nav" -> {
                        var launchIntent = if (pkg.isNotEmpty()) packageManager.getLaunchIntentForPackage(pkg) else null
                        if (launchIntent != null) {
                          startActivity(launchIntent)
                        } else {
                          startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("geo:0,0?q=")).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                        }
                      }
                    }
                    result.success(true)
                  } catch (e: Exception) {
                    result.success(false)
                  }
                }
              }
          }
          EOF

          # اضافه کردن مجوزهای لازم و تگ لانچر پیش‌فرض خودرو
          sed -i 's/<application/<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>\n    <application/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<category android:name="android.intent.category.LAUNCHER"\/>/<category android:name="android.intent.category.LAUNCHER"\/>\n                <category android:name="android.intent.category.HOME"\/>\n                <category android:name="android.intent.category.DEFAULT"\/>/g' android/app/src/main/AndroidManifest.xml

          flutter pub get
          flutter build apk --release

          cp build/app/outputs/flutter-apk/app-release.apk ../app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tiba-launcher-apk
          path: app-release.apk
