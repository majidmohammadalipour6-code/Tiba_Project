name: Build Tiba Project APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.5'
          channel: 'stable'
          cache: true

      - name: Create Standard Flutter Project Structure
        run: |
          mkdir -p temp_lib
          if [ -d "lib" ]; then cp -r lib/* temp_lib/; fi
          if [ -f "pubspec.yaml" ]; then cp pubspec.yaml temp_pubspec.yaml; fi
          
          flutter create . --org com.tiba.project --project-name tiba_project --platforms android
          
          if [ -d "temp_lib" ] && [ "$(ls -A temp_lib)" ]; then rm -rf lib/* && cp -r temp_lib/* lib/; fi
          if [ -f "temp_pubspec.yaml" ]; then cp temp_pubspec.yaml pubspec.yaml; fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK with Info
        run: flutter build apk --debug --no-tree-shake-icons --info
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tiba-Dashboard-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
