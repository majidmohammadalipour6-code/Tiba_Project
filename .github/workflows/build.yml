name: Build Tiba Launcher

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable

      - name: Create Flutter Project
        run: |
          flutter create --org com.tiba2 tiba_project
          cd tiba_project

          cp ../lib/main.dart lib/main.dart

          if [ -f "../tiba2.png" ]; then
            cp ../tiba2.png ./
          fi

          if [ -f "../tiba2_rear.png" ]; then
            cp ../tiba2_rear.png ./
          fi

          cat >> pubspec.yaml <<'EOF'
            assets:
              - tiba2.png
              - tiba2_rear.png
          EOF

      - name: Configure Android Manifest
        run: |
          cd tiba_project

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>\n    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"\/>\n    <application/' "$MANIFEST"

          sed -i 's/<category android:name="android.intent.category.LAUNCHER"\/>/<category android:name="android.intent.category.LAUNCHER"\/>\n                <category android:name="android.intent.category.HOME"\/>\n                <category android:name="android.intent.category.DEFAULT"\/>/' "$MANIFEST"

      - name: Configure Native GPS and Actions
        run: |
          cd tiba_project

          KT_PATH="android/app/src/main/kotlin/com/tiba2/tiba_project/MainActivity.kt"
          mkdir -p "$(dirname "$KT_PATH")"

          cat > "$KT_PATH" <<'EOF'
          package com.tiba2.tiba_project

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.location.Location
          import android.location.LocationListener
          import android.location.LocationManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity(), LocationListener {
              private val CHANNEL = "com.tiba2.launcher/actions"
              private var locationManager: LocationManager? = null
              private var methodChannel: MethodChannel? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  methodChannel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)
                  methodChannel?.setMethodCallHandler { call, result ->
                      when (call.method) {
                          "openSettings" -> {
                              val intent = Intent(Settings.ACTION_SETTINGS)
                              intent.flags = Intent.FLAG_ACTIVITY_NEW_TASK
                              startActivity(intent)
                              result.success(true)
                          }
                          "openLocationSettings" -> {
                              val intent = Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS)
                              intent.flags = Intent.FLAG_ACTIVITY_NEW_TASK
                              startActivity(intent)
                              result.success(true)
                          }
                          "openRadio" -> {
                              val radioIntent = packageManager.getLaunchIntentForPackage("com.android.fmradio")
                                  ?: Intent(Intent.ACTION_MAIN).also { it.addCategory(Intent.CATEGORY_APP_MUSIC) }
                              radioIntent.flags = Intent.FLAG_ACTIVITY_NEW_TASK
                              try { startActivity(radioIntent); result.success(true) } catch (e: Exception) { result.success(false) }
                          }
                          "openDialer" -> {
                              val intent = Intent(Intent.ACTION_DIAL)
                              intent.flags = Intent.FLAG_ACTIVITY_NEW_TASK
                              startActivity(intent)
                              result.success(true)
                          }
                          "openMaps" -> {
                              val intent = Intent(Intent.ACTION_VIEW, Uri.parse("geo:0,0?q="))
                              intent.flags = Intent.FLAG_ACTIVITY_NEW_TASK
                              startActivity(intent)
                              result.success(true)
                          }
                          "startGps" -> {
                              startGpsTracking()
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              private fun startGpsTracking() {
                  locationManager = getSystemService(LOCATION_SERVICE) as LocationManager
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                      locationManager?.requestLocationUpdates(LocationManager.GPS_PROVIDER, 500L, 0f, this)
                  }
              }

              override fun onLocationChanged(location: Location) {
                  val speedKmh = location.speed * 3.6f
                  runOnUiThread {
                      methodChannel?.invokeMethod("onSpeedUpdate", speedKmh)
                  }
              }

              override fun onStatusChanged(provider: String?, status: Int, extras: Bundle?) {}
              override fun onProviderEnabled(provider: String) {}
              override fun onProviderDisabled(provider: String) {}
          }
          EOF

      - name: Build APK
        run: |
          cd tiba_project
          flutter build apk --release

      - name: Upload Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: Tiba2-Launcher-APK
          path: tiba_project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
