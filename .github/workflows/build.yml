name: Build Tiba Launcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Create Android Platform if Missing
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.tiba.launcher --project-name tiba_project
          fi

      - name: Inject Custom MainActivity for App Drawer
        run: |
          python3 - <<'EOF'
          import os

          main_activity_path = 'android/app/src/main/kotlin/com/tiba/launcher/MainActivity.kt'
          os.makedirs(os.path.dirname(main_activity_path), exist_ok=True)
          
          kotlin_code = '''package com.tiba.launcher

          import android.content.Intent
          import android.content.pm.PackageManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.tiba.launcher/app"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "openApp" -> {
                              val packageName = call.argument<String>("package")
                              val intent = packageManager.getLaunchIntentForPackage(packageName ?: "")
                              if (intent != null) {
                                  startActivity(intent)
                                  result.success(true)
                              } else {
                                  result.error("UNAVAILABLE", "App not found", null)
                              }
                          }
                          "getInstalledApps" -> {
                              val pm = packageManager
                              val intent = Intent(Intent.ACTION_MAIN, null).addCategory(Intent.CATEGORY_LAUNCHER)
                              val resolveInfos = pm.queryIntentActivities(intent, 0)
                              val apps = mutableListOf<Map<String, String>>()
                              for (resolveInfo in resolveInfos) {
                                  val appName = resolveInfo.loadLabel(pm).toString()
                                  val packageName = resolveInfo.activityInfo.packageName
                                  apps.add(mapOf("name" to appName, "package" to packageName))
                              }
                              result.success(apps)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }
          }
          '''
          
          with open(main_activity_path, 'w', encoding='utf-8') as f:
              f.write(kotlin_code)
          print("MainActivity.kt injected successfully.")
          EOF

      - name: Force Modern Kotlin Version
        run: |
          python3 - <<'EOF'
          import os, re

          settings_gradle = 'android/settings.gradle'
          if os.path.exists(settings_gradle):
              content = open(settings_gradle, encoding='utf-8').read()
              if 'org.jetbrains.kotlin.android' in content:
                  content = re.sub(r'id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'][^"\']+["\']', 'id "org.jetbrains.kotlin.android" version "2.1.0"', content)
              else:
                  if 'plugins {' in content:
                      content = content.replace('plugins {', 'plugins {\n    id "org.jetbrains.kotlin.android" version "2.1.0" apply false')
              open(settings_gradle, 'w', encoding='utf-8').write(content)

          build_gradle = 'android/build.gradle'
          if os.path.exists(build_gradle):
              content = open(build_gradle, encoding='utf-8').read()
              if 'ext.kotlin_version' in content:
                  content = re.sub(r'ext\.kotlin_version\s*=\s*[\'"][^\'"]+[\'"]', "ext.kotlin_version = '2.1.0'", content)
              else:
                  content = "buildscript {\n    ext.kotlin_version = '2.1.0'\n}\n" + content
              open(build_gradle, 'w', encoding='utf-8').write(content)
          EOF

      - name: Patch AndroidManifest for Home Launcher
        run: |
          python3 - <<'EOF'
          import os

          path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(path):
              s = open(path, encoding='utf-8').read()
              if 'category.HOME' not in s:
                  s = s.replace(
                      '<category android:name="android.intent.category.LAUNCHER" />',
                      '<category android:name="android.intent.category.LAUNCHER" />\n'
                      '                <category android:name="android.intent.category.HOME" />\n'
                      '                <category android:name="android.intent.category.DEFAULT" />'
                  )
              open(path, 'w', encoding='utf-8').write(s)
          EOF

      - name: Set SDK Properties
        run: |
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.targetSdkVersion=35" >> android/local.properties
          echo "flutter.compileSdkVersion=35" >> android/local.properties

      - name: Fetch Dependencies
        run: |
          flutter pub get

      - name: Build Launcher APK
        run: |
          flutter build apk --release --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tiba2_Launcher_App
          path: build/app/outputs/flutter-apk/app-release.apk
