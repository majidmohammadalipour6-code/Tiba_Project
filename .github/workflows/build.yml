name: Build Tiba Launcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Check & Fix Android Structure
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.tiba.launcher --project-name tiba_project
          fi

      - name: Ensure Assets Exist
        run: |
          if [ ! -f "tiba2.png" ]; then
            python3 -c "import base64; open('tiba2.png','wb').write(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='))"
          fi

      - name: Patch AndroidManifest
        run: |
          python3 - <<'EOF'
          path = 'android/app/src/main/AndroidManifest.xml'
          s = open(path, encoding='utf-8').read()

          perms = '''    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          '''
          if 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' not in s:
              idx = s.index('>') + 1
              s = s[:idx] + '\n' + perms + s[idx:]

          if 'category.HOME' not in s:
              s = s.replace(
                  '<category android:name="android.intent.category.LAUNCHER" />',
                  '<category android:name="android.intent.category.LAUNCHER" />\n'
                  '                <category android:name="android.intent.category.HOME" />\n'
                  '                <category android:name="android.intent.category.DEFAULT" />'
              )

          if 'launchMode' not in s:
              s = s.replace('<activity', '<activity\n                android:launchMode="singleTask"', 1)

          svc = '''
                  <service
                      android:name="com.ryanheise.audioservice.AudioService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="false" />
                  <receiver
                      android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MEDIA_BUTTON" />
                      </intent-filter>
                  </receiver>
              '''
          if 'audioservice.AudioService' not in s:
              s = s.replace('</application>', svc + '\n    </application>')

          open(path, 'w', encoding='utf-8').write(s)
          EOF

      - name: Set SDK Versions
        run: |
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.targetSdkVersion=35" >> android/local.properties
          echo "flutter.compileSdkVersion=35" >> android/local.properties

      - name: Fetch Dependencies
        run: |
          flutter pub get

      - name: Auto-Patch All Cached Plugins Gradle Files
        run: |
          python3 - <<'EOF'
          import os
          import re

          cache_dir = os.path.expanduser('~/.pub-cache')
          count = 0

          for root, dirs, files in os.walk(cache_dir):
              for file in files:
                  if file == 'build.gradle':
                      fpath = os.path.join(root, file)
                      try:
                          with open(fpath, 'r', encoding='utf-8', errors='ignore') as f:
                              text = f.read()

                          # جایگزینی هرگونه استفاده از flutter.*SdkVersion با عدد مستقیم
                          new_text = re.sub(r'compileSdkVersion\s+.*flutter.*', 'compileSdkVersion 35', text)
                          new_text = re.sub(r'targetSdkVersion\s+.*flutter.*', 'targetSdkVersion 35', new_text)
                          new_text = re.sub(r'minSdkVersion\s+.*flutter.*', 'minSdkVersion 21', new_text)

                          # اگر خطای flutter به صورت شیء مجزا وجود داشت
                          new_text = re.sub(r'flutter\s*\{[^}]*\}', '', new_text)

                          if new_text != text:
                              with open(fpath, 'w', encoding='utf-8') as f:
                                  f.write(new_text)
                              count += 1
                              print(f"Patched: {fpath}")
                      except Exception as e:
                          pass

          print(f"Total plugin gradle files patched: {count}")
          EOF

      - name: Build Launcher APK
        run: |
          flutter build apk --release --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tiba2_Launcher_App
          path: build/app/outputs/flutter-apk/app-release.apk
