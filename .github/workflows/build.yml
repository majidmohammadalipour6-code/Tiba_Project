name: Build Tiba Launcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Check & Fix Android Structure
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.tiba.launcher --project-name tiba_project
          fi

      - name: Ensure Assets Exist
        run: |
          if [ ! -f "tiba2.png" ]; then
            python3 -c "import base64; open('tiba2.png','wb').write(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='))"
          fi

      - name: Upgrade Kotlin Version
        run: |
          python3 - <<'EOF'
          import os, re

          settings_gradle = 'android/settings.gradle'
          if os.path.exists(settings_gradle):
              content = open(settings_gradle, encoding='utf-8').read()
              content = re.sub(r'id "org\.jetbrains\.kotlin\.android" version "[^"]+"', 'id "org.jetbrains.kotlin.android" version "2.0.21"', content)
              open(settings_gradle, 'w', encoding='utf-8').write(content)

          build_gradle = 'android/build.gradle'
          if os.path.exists(build_gradle):
              content = open(build_gradle, encoding='utf-8').read()
              if 'ext.kotlin_version' in content:
                  content = re.sub(r'ext\.kotlin_version\s*=\s*[\'"][^\'"]+[\'"]', "ext.kotlin_version = '2.0.21'", content)
              else:
                  content = "buildscript { ext.kotlin_version = '2.0.21' }\n" + content
              open(build_gradle, 'w', encoding='utf-8').write(content)
          EOF

      - name: Fix App Build Gradle Sdk Versions
        run: |
          python3 - <<'EOF'
          path = 'android/app/build.gradle'
          with open(path, 'r', encoding='utf-8') as f:
              lines = f.readlines()

          new_lines = []
          for line in lines:
              # بازنویسی تمیز مقادیر sdk فقط در صورتی که مربوط به android باشند
              if 'compileSdkVersion' in line:
                  new_lines.append('    compileSdkVersion 35\n')
              elif 'compileSdk ' in line or 'compileSdk=' in line:
                  new_lines.append('    compileSdk = 35\n')
              elif 'minSdkVersion' in line and 'flutter' not in line:
                  new_lines.append('        minSdkVersion 21\n')
              elif 'targetSdkVersion' in line and 'flutter' not in line:
                  new_lines.append('        targetSdkVersion 35\n')
              else:
                  new_lines.append(line)

          with open(path, 'w', encoding='utf-8') as f:
              f.writelines(new_lines)
          EOF

      - name: Patch AndroidManifest
        run: |
          python3 - <<'EOF'
          path = 'android/app/src/main/AndroidManifest.xml'
          s = open(path, encoding='utf-8').read()

          perms = '''    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          '''
          if 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' not in s:
              idx = s.index('>') + 1
              s = s[:idx] + '\n' + perms + s[idx:]

          if 'category.HOME' not in s:
              s = s.replace(
                  '<category android:name="android.intent.category.LAUNCHER" />',
                  '<category android:name="android.intent.category.LAUNCHER" />\n'
                  '                <category android:name="android.intent.category.HOME" />\n'
                  '                <category android:name="android.intent.category.DEFAULT" />'
              )

          if 'launchMode' not in s:
              s = s.replace('<activity', '<activity\n                android:launchMode="singleTask"', 1)

          svc = '''
                  <service
                      android:name="com.ryanheise.audioservice.AudioService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="false" />
                  <receiver
                      android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MEDIA_BUTTON" />
                      </intent-filter>
                  </receiver>
              '''
          if 'audioservice.AudioService' not in s:
              s = s.replace('</application>', svc + '\n    </application>')

          open(path, 'w', encoding='utf-8').write(s)
          EOF

      - name: Set SDK Properties
        run: |
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.targetSdkVersion=35" >> android/local.properties
          echo "flutter.compileSdkVersion=35" >> android/local.properties

      - name: Fetch Dependencies
        run: |
          flutter pub get

      - name: Patch Plugins In Pub Cache
        run: |
          python3 - <<'EOF'
          import os

          cache_dir = os.path.expanduser('~/.pub-cache')
          for root, dirs, files in os.walk(cache_dir):
              for file in files:
                  if file == 'build.gradle':
                      path = os.path.join(root, file)
                      try:
                          with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                              lines = f.readlines()
                          
                          changed = False
                          new_lines = []
                          for line in lines:
                              if 'flutter.compileSdkVersion' in line:
                                  new_lines.append('    compileSdkVersion 35\n')
                                  changed = True
                              elif 'flutter.targetSdkVersion' in line:
                                  new_lines.append('    targetSdkVersion 35\n')
                                  changed = True
                              elif 'flutter.minSdkVersion' in line:
                                  new_lines.append('    minSdkVersion 21\n')
                                  changed = True
                              elif 'compileSdkVersion' in line and ('project.android.flutter' in line or 'flutter.' in line):
                                  new_lines.append('    compileSdkVersion 35\n')
                                  changed = True
                              else:
                                  new_lines.append(line)
                          
                          if changed:
                              with open(path, 'w', encoding='utf-8') as f:
                                  f.writelines(new_lines)
                      except Exception as e:
                          pass
          EOF

      - name: Overwrite Broken Geolocator Gradle
        run: |
          find /home/runner/.pub-cache -name "build.gradle" | grep "geolocator_android" | while read file; do
            cat << 'GRADLE_EOF' > "$file"
          group 'com.baseflow.geolocator'
          version '1.0-SNAPSHOT'

          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
              }
          }

          apply plugin: 'com.android.library'

          android {
              namespace "com.baseflow.geolocator"
              compileSdkVersion 35

              defaultConfig {
                  minSdkVersion 21
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation 'com.google.android.gms:play-services-location:21.2.0'
              implementation 'androidx.annotation:annotation:1.7.1'
              implementation 'androidx.core:core:1.13.1'
          }
          GRADLE_EOF
          done

      - name: Build Launcher APK
        run: |
          flutter build apk --release --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tiba2_Launcher_App
          path: build/app/outputs/flutter-apk/app-release.apk
