name: Build Tiba Launcher APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Create Clean Flutter Project
        run: |
          flutter create . --org com.tiba.launcher --project-name tiba_launcher

      - name: Add Geolocator Dependency
        run: |
          flutter pub add geolocator

      - name: Configure Android Permissions & MinSdkVersion
        run: |
          # افزودن دسترسی‌های مکان به مانیفست
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' $MANIFEST
          fi

          # تنظیم حداقل SDK اندروید روی 21 برای سازگاری کامل پکیج‌ها
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' $GRADLE_FILE
          fi

      - name: Build Debug APK
        run: |
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tiba2-Launcher-GPS-Final
          path: build/app/outputs/flutter-apk/app-debug.apk
