name: Build Tiba Launcher

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable

      - name: Create Flutter Project
        run: |
          flutter create --org com.tiba2 tiba_project
          cd tiba_project

          flutter pub add geolocator:13.0.2

          cp ../lib/main.dart lib/main.dart

          if [ -f "../tiba2.png" ]; then
            cp ../tiba2.png ./
          fi

          if [ -f "../tiba2_rear.png" ]; then
            cp ../tiba2_rear.png ./
          fi

          cat >> pubspec.yaml <<'EOF'
            assets:
              - tiba2.png
              - tiba2_rear.png
          EOF

      - name: Configure Android Permissions
        run: |
          cd tiba_project

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>\n    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"\/>\n    <application/' "$MANIFEST"

          sed -i 's/<category android:name="android.intent.category.LAUNCHER"\/>/<category android:name="android.intent.category.LAUNCHER"\/>\n                <category android:name="android.intent.category.HOME"\/>\n                <category android:name="android.intent.category.DEFAULT"\/>/' "$MANIFEST"

      - name: Configure Android Gradle
        run: |
          cd tiba_project

          echo "Checking generated Android configuration..."

          cat android/settings.gradle

          cat android/app/build.gradle

      - name: Build Release APK
        run: |
          cd tiba_project

          flutter clean
          flutter pub get
          flutter build apk --release

          cp build/app/outputs/flutter-apk/app-release.apk ../app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tiba-launcher-apk
          path: app-release.apk
