name: Build Tiba Project APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Build Clean Flutter Project
        run: |
          mkdir -p /tmp/user_code
          if [ -d "lib" ]; then cp -r lib/* /tmp/user_code/; fi
          if [ -f "pubspec.yaml" ]; then cp pubspec.yaml /tmp/user_code/; fi
          
          rm -rf ./* ./.github
          
          flutter create . --org com.tiba.project --project-name tiba_project --platforms android
          
          if [ -d "/tmp/user_code/lib" ]; then cp -r /tmp/user_code/lib/* lib/; fi
          if [ -f "/tmp/user_code/pubspec.yaml" ]; then cp /tmp/user_code/pubspec.yaml pubspec.yaml; fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug --
