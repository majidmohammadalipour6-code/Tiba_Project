name: Build Tiba Launcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Check & Fix Android Structure
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.tiba.launcher --project-name tiba_project
          fi

      - name: Ensure Assets Exist
        run: |
          if [ ! -f "tiba2.png" ]; then
            python3 -c "import base64; open('tiba2.png','wb').write(base64.b64decode('*******'))"
          fi

      - name: Force Modern Kotlin Version
        run: |
          python3 - <<'EOF'
          import os, re

          settings_gradle = 'android/settings.gradle'
          if os.path.exists(settings_gradle):
              content = open(settings_gradle, encoding='utf-8').read()
              if 'org.jetbrains.kotlin.android' in content:
                  content = re.sub(r'id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'][^"\']+["\']', 'id "org.jetbrains.kotlin.android" version "2.1.0"', content)
              else:
                  if 'plugins {' in content:
                      content = content.replace('plugins {', 'plugins {\n    id "org.jetbrains.kotlin.android" version "2.1.0" apply false')
              open(settings_gradle, 'w', encoding='utf-8').write(content)

          build_gradle = 'android/build.gradle'
          if os.path.exists(build_gradle):
              content = open(build_gradle, encoding='utf-8').read()
              if 'ext.kotlin_version' in content:
                  content = re.sub(r'ext\.kotlin_version\s*=\s*[\'"][^\'"]+[\'"]', "ext.kotlin_version = '2.1.0'", content)
              else:
                  content = "buildscript {\n    ext.kotlin_version = '2.1.0'\n}\n" + content
              open(build_gradle, 'w', encoding='utf-8').write(content)
          EOF

      - name: Patch AndroidManifest
        run: |
          python3 - <<'EOF'
          import os

          path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(path):
              s = open(path, encoding='utf-8').read()
              perms = '''    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
                  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
                  <uses-permission android:name="android.permission.WAKE_LOCK" />
                  <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
                  <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
                  <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
                  <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              '''
              if 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' not in s:
                  idx = s.index('>') + 1
                  s = s[:idx] + '\n' + perms + s[idx:]

              if 'category.HOME' not in s:
                  s = s.replace(
                      '<category android:name="android.intent.category.LAUNCHER" />',
                      '<category android:name="android.intent.category.LAUNCHER" />\n'
                      '                <category android:name="android.intent.category.HOME" />\n'
                      '                <category android:name="android.intent.category.DEFAULT" />'
                  )

              if 'launchMode' not in s:
                  s = s.replace('<activity', '<activity\n                android:launchMode="singleTask"', 1)
              
              open(path, 'w', encoding='utf-8').write(s)
          EOF

      - name: Set SDK Properties
        run: |
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.targetSdkVersion=35" >> android/local.properties
          echo "flutter.compileSdkVersion=35" >> android/local.properties

      - name: Fetch Dependencies
        run: |
          flutter pub get

      - name: Bruteforce Patch All Cached Plugins
        run: |
          python3 - <<'EOF'
          import os

          cache_dir = os.path.expanduser('~/.pub-cache')
          for root, dirs, files in os.walk(cache_dir):
              for file in files:
                  if file.endswith('build.gradle'):
                      filepath = os.path.join(root, file)
                      try:
                          with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                              lines = f.readlines()
                          
                          changed = False
                          new_lines = []
                          for line in lines:
                              if 'compileSdkVersion' in line and ('flutter' in line or 'project.' in line):
                                  new_lines.append('    compileSdkVersion 35\n')
                                  changed = True
                              elif 'compileSdk ' in line and ('flutter' in line or 'project.' in line):
                                  new_lines.append('    compileSdk = 35\n')
                                  changed = True
                              elif 'minSdkVersion' in line and ('flutter' in line or 'project.' in line):
                                  new_lines.append('    minSdkVersion 21\n')
                                  changed = True
                              elif 'targetSdkVersion' in line and ('flutter' in line or 'project.' in line):
                                  new_lines.append('    targetSdkVersion 35\n')
                                  changed = True
                              else:
                                  new_lines.append(line)
                          
                          if changed:
                              with open(filepath, 'w', encoding='utf-8') as f:
                                  f.writelines(new_lines)
                      except Exception:
                          pass
          EOF

      - name: Overwrite Known Fragile Plugins
        run: |
          find /home/runner/.pub-cache -name "build.gradle" | grep "geolocator_android" | while read file; do
            cat << 'GRADLE_EOF' > "$file"
          group 'com.baseflow.geolocator'
          version '1.0-SNAPSHOT'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          apply plugin: 'com.android.library'
          android {
              namespace "com.baseflow.geolocator"
              compileSdkVersion 35
              defaultConfig { minSdkVersion 21 }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'com.google.android.gms:play-services-location:21.2.0'
              implementation 'androidx.annotation:annotation:1.7.1'
              implementation 'androidx.core:core:1.13.1'
          }
          GRADLE_EOF
          done

      - name: Build Launcher APK
        run: |
          flutter build apk --release --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tiba2_Launcher_App
          path: build/app/outputs/flutter-apk/app-release.apk
