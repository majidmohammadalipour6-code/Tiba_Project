name: Build Tiba Launcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Check & Fix Android Structure
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.tiba.launcher --project-name tiba_project
          fi

      - name: Ensure Assets Exist (Placeholder if missing)
        run: |
          if [ ! -f "tiba2.png" ]; then
            python3 -c "import base64; open('tiba2.png','wb').write(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='))"
          fi

      - name: Patch Gradle for Flutter Properties
        run: |
          python3 - <<'EOF'
          # رفع قطعی مشکل missing flutter extension برای تمام ساب‌پروژه‌ها
          path = 'android/build.gradle'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          # اگر کدهای بعد از ارزیابی قبلی مانده باشد پاکسازی می‌کنیم
          if "Cannot run Project.afterEvaluate" in content or "afterEvaluate" in content:
              content = content.split("allprojects {")[0]

          injection = """
          subprojects {
              project.evaluationDependsOn(':app')
          }
          """
          if 'evaluationDependsOn' not in content:
              content += "\n" + injection

          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          EOF

      - name: Patch AndroidManifest
        run: |
          python3 - <<'EOF'
          path = 'android/app/src/main/AndroidManifest.xml'
          s = open(path, encoding='utf-8').read()

          perms = '''    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          '''
          if 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' not in s:
              idx = s.index('>') + 1
              s = s[:idx] + '\n' + perms + s[idx:]

          if 'category.HOME' not in s:
              s = s.replace(
                  '<category android:name="android.intent.category.LAUNCHER" />',
                  '<category android:name="android.intent.category.LAUNCHER" />\n'
                  '                <category android:name="android.intent.category.HOME" />\n'
                  '                <category android:name="android.intent.category.DEFAULT" />'
              )

          if 'launchMode' not in s:
              s = s.replace('<activity', '<activity\n                android:launchMode="singleTask"', 1)

          svc = '''
                  <service
                      android:name="com.ryanheise.audioservice.AudioService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="false" />
                  <receiver
                      android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MEDIA_BUTTON" />
                      </intent-filter>
                  </receiver>
              '''
          if 'audioservice.AudioService' not in s:
              s = s.replace('</application>', svc + '\n    </application>')

          open(path, 'w', encoding='utf-8').write(s)
          EOF

      - name: Set SDK Versions
        run: |
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties
          echo "flutter.compileSdkVersion=34" >> android/local.properties

      - name: Build Launcher APK
        run: |
          flutter pub upgrade geolocator
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tiba2_Launcher_App
          path: build/app/outputs/flutter-apk/app-release.apk
