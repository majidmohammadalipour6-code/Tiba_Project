name: Build Tiba Launcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Check & Ensure Android Skeleton
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.tiba.launcher --project-name tiba_project
          fi

      - name: Clean Root build.gradle
        run: |
          python3 - <<'EOF'
          import os

          path = 'android/build.gradle'
          if os.path.exists(path):
              clean_build_gradle = """allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          """
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(clean_build_gradle)
          EOF

      - name: Force Modern Kotlin Version
        run: |
          python3 - <<'EOF'
          import os, re

          settings_gradle = 'android/settings.gradle'
          if os.path.exists(settings_gradle):
              content = open(settings_gradle, encoding='utf-8').read()
              if 'org.jetbrains.kotlin.android' in content:
                  content = re.sub(r'id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'][^"\']+["\']', 'id "org.jetbrains.kotlin.android" version "2.1.0"', content)
              else:
                  if 'plugins {' in content:
                      content = content.replace('plugins {', 'plugins {\n    id "org.jetbrains.kotlin.android" version "2.1.0" apply false')
              open(settings_gradle, 'w', encoding='utf-8').write(content)
          EOF

      - name: Patch AndroidManifest
        run: |
          python3 - <<'EOF'
          import os
          path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(path):
              s = open(path, encoding='utf-8').read()
              perms = '''    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
                  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
                  <uses-permission android:name="android.permission.WAKE_LOCK" />
                  <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
                  <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
                  <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
                  <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              '''
              if 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' not in s:
                  idx = s.index('>') + 1
                  s = s[:idx] + '\n' + perms + s[idx:]

              if 'category.HOME' not in s:
                  s = s.replace(
                      '<category android:name="android.intent.category.LAUNCHER" />',
                      '<category android:name="android.intent.category.LAUNCHER" />\n'
                      '                <category android:name="android.intent.category.HOME" />\n'
                      '                <category android:name="android.intent.category.DEFAULT" />'
                  )

              if 'launchMode' not in s:
                  s = s.replace('<activity', '<activity\n                android:launchMode="singleTask"', 1)

              open(path, 'w', encoding='utf-8').write(s)
          EOF

      - name: Set SDK Properties
        run: |
          mkdir -p android
          touch android/local.properties
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.targetSdkVersion=35" >> android/local.properties
          echo "flutter.compileSdkVersion=35" >> android/local.properties

      - name: Fetch Dependencies
        run: |
          flutter pub get

      - name: Check Dart Errors
        run: |
          flutter analyze lib/main.dart

      - name: Overwrite Fragile Plugins
        run: |
          find /home/runner/.pub-cache -name "build.gradle" | grep "geolocator_android" | while read file; do
            cat << 'GRADLE_EOF' > "$file"
          group 'com.baseflow.geolocator'
          version '1.0-SNAPSHOT'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          apply plugin: 'com.android.library'
          android {
              namespace "com.baseflow.geolocator"
              compileSdkVersion 35
              defaultConfig { minSdkVersion 21 }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'com.google.android.gms:play-services-location:21.2.0'
              implementation 'androidx.annotation:annotation:1.7.1'
              implementation 'androidx.core:core:1.13.1'
          }
          GRADLE_EOF
          done

          find /home/runner/.pub-cache -name "build.gradle" | grep "package_info_plus" | while read file; do
            cat << 'GRADLE_EOF' > "$file"
          group 'dev.fluttercommunity.plus.packageinfo'
          version '1.0-SNAPSHOT'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          apply plugin: 'com.android.library'
          android {
              namespace "dev.fluttercommunity.plus.packageinfo"
              compileSdkVersion 35
              defaultConfig { minSdkVersion 21 }
          }
          GRADLE_EOF
          done

      - name: Build Launcher APK
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tiba2_Launcher_App
          path: build/app/outputs/flutter-apk/app-release.apk
