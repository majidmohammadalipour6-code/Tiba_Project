name: Build Tiba Launcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Check & Fix Android Structure
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.tiba.launcher --project-name tiba_project
          fi

      - name: Disable lintVital (common release build breaker)
        run: |
          FILE=android/app/build.gradle
          if [ -f "$FILE" ] && ! grep -q "checkReleaseBuilds" "$FILE"; then
            printf '\nandroid {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n}\n' >> "$FILE"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --split-per-abi --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tiba-apk
          path: build/app/outputs/flutter-apk/*.apk
